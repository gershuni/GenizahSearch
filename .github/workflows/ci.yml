name: CI

on:
  push:
    branches: [master-main]
  pull_request:

jobs:
  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.15.10  # Pinned -- update version intentionally
      - run: ruff check .
      - run: python scripts/check_docs.py

  tests:
    needs: lint-and-docs
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -r requirements-lock.txt
      # pytest and ruff are CI-only dev tools, not runtime deps
      - run: pip install pytest
      - run: pytest tests/
