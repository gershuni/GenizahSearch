name: CI

on:
  push:
    branches: [master-main]
  pull_request:

jobs:
  lint-and-docs:
    # Bounded so a hung runner fails in minutes instead of burning GitHub's
    # 6-hour default. Added 2026-08-18 after a random ubuntu job stalled ~6h on
    # `apt-get` while the identical step succeeded in two sibling jobs of the
    # same run -- infrastructure, not this repo, but with no bound it made a
    # green build indistinguishable from a hung one for a whole working day.
    # Values are ~3x the observed p100 (slowest measured: tests/windows 21 min).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install ruff==0.15.10  # Pinned -- update version intentionally
      - run: ruff check .
      - run: python scripts/check_docs.py

  tests:
    timeout-minutes: 60
    needs: lint-and-docs
    env:
      # PyQt6 tests (e.g. desktop-telemetry consent dialogs) construct a real
      # QApplication and dispatch widget events. Without a platform plugin the
      # headless Linux runner falls back to xcb (no display) and segfaults
      # (exit 139). 'offscreen' is the documented headless mode — see the
      # test docstrings and CLAUDE.md (GITHUB_ACTIONS is auto-set by the runner).
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -r requirements-lock.txt
      # pytest and ruff are CI-only dev tools, not runtime deps
      - run: pip install pytest
      # `-m "not gui"` deselects PyQt6 event-dispatching dialog tests (auto-marked
      # `gui` in tests/conftest.py). Run together in this one process they tip the
      # accumulated Qt state into SIGSEGV (exit 139) after ~3000 tests. They run
      # in their own fresh process in the `gui-tests` job below.
      # `not render_smoke` deselects the NiceGUI render-smoke tests (auto-marked in
      # tests/conftest.py): they enter+tear down the app lifespan via asyncio.run,
      # closing the event loop + deleting the auto-index client, which poisons any
      # later NiceGUI test in the same process. They run in the `render-smoke-tests`
      # job below (fresh process).
      # `not atlas_bake` deselects the Phase 133 atlas-bake invariant tests
      # (auto-marked in tests/conftest.py): they require the pinned bake-time deps
      # in requirements-atlas-bake.txt (networkx/python-louvain/Brotli), which are
      # NOT installed in this job (the test module also self-skips via
      # pytest.importorskip as defense in depth). They run for real in the
      # dedicated `atlas-bake-tests` job below.
      - run: pytest tests/ -m "not gui and not render_smoke and not atlas_bake"

  # THE D-25 MASKING PATTERN SET IS PROVISIONED HERE, and this job is where the
  # discovery surfaces' masking scan runs (tests/render_smoke/
  # test_panel_render_smoke.py). Until this step existed there was no tracked
  # provisioning at all: a clean checkout had no pattern file, so the required
  # masking test skipped, and a restricted corpus name could have reached a
  # committed surface while the gate reported a pass.
  #
  # The restricted names are NEVER committed (that is the rule the scan
  # enforces). They come from the `MASKING_SCAN_PATTERNS` repository secret,
  # are written to a gitignored path for the length of the job, and are deleted
  # in an `if: always()` step.
  #
  # IF THE SECRET IS NOT SET, this job goes RED, deliberately: the scan then has
  # zero patterns, and `scripts/check_atlas_masking.py` exits 1 on a
  # zero-pattern run rather than reporting a clean surface it never inspected.
  # Do not "fix" that by removing this step or restoring the test's skip -- add
  # the secret. The scan MECHANISM is proved separately and unconditionally by
  # `test_the_masking_scanner_can_actually_fail_on_this_capture`, which uses a
  # fabricated needle and needs no secret, so a red run here means exactly one
  # thing: this environment has no pattern set.
  render-smoke-tests:
    timeout-minutes: 40
    needs: lint-and-docs
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      MASKING_SCAN_PATTERNS_FILE: ${{ github.workspace }}/.masking_patterns
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -r requirements-lock.txt
      - run: pip install pytest
      # Written with Python rather than a shell redirect so the same step works
      # on both matrix legs, and so the secret never appears in an echoed
      # command line. `/.masking_patterns` is already gitignored, so the file
      # cannot be picked up as an untracked candidate by the scan's own repo
      # surface.
      - name: Provision the D-25 masking pattern set
        env:
          MASKING_SCAN_PATTERNS: ${{ secrets.MASKING_SCAN_PATTERNS }}
        shell: python
        run: |
          import os, pathlib
          target = pathlib.Path(os.environ['MASKING_SCAN_PATTERNS_FILE'])
          target.write_text(os.environ.get('MASKING_SCAN_PATTERNS', ''), encoding='utf-8')
          try:
              os.chmod(target, 0o600)   # no-op on Windows; harmless
          except OSError:
              pass
          print(f'wrote {sum(1 for line in target.read_text(encoding="utf-8").splitlines() if line.strip() and not line.strip().startswith("#"))} pattern(s)')
      # Fresh process, only the render-smoke tests. They drive a NiceGUI User through
      # the app lifespan and are safe to run together (each restores slot_stack for
      # its siblings) but must NOT share a process with the broader suite.
      - run: pytest tests/ -m render_smoke
      - name: Remove the masking pattern set
        if: always()
        shell: python
        run: |
          import os, pathlib
          pathlib.Path(os.environ['MASKING_SCAN_PATTERNS_FILE']).unlink(missing_ok=True)

  # The real-browser actionability gate for the findings page's "more matches"
  # control (Phase 136, plan 136-16 criteria (e) and (f)). It drives Chromium at
  # 375x812 and 1440x900, in both languages, clicks the control with NO preceding
  # disclosure action, and then runs its own positive control by collapsing the
  # control's parent and requiring the same probe to fail.
  #
  # UBUNTU ONLY, deliberately. Every other job here runs the ubuntu+windows
  # matrix; this one does not, because a Chromium download plus `--with-deps` on
  # a second OS roughly doubles the job's wall time to re-test a property that is
  # not platform-dependent: this is a check about DOM actionability (is the
  # control visible, enabled, unobstructed and hit-testable without any
  # disclosure step), not about platform rendering. Both viewport widths and both
  # languages -- including the RTL pass, which is the one that can see a
  # mirrored-layout clip -- are already covered inside this single browser.
  #
  # WHY IT NEEDS A FIXTURE SIDECAR: the findings page is gated on
  # web/discovery_assets.py::discovery_available() = DISCOVERY_ENABLED AND a
  # startup-validated sidecar. discovery_data/ is gitignored, so on a bare runner
  # the route clean-hides and this check would fail for a reason that has nothing
  # to do with the control. The job therefore materializes the SYNTHETIC fixture
  # sidecar into a temp directory and points the app at it with
  # GENIZAH_DISCOVERY_DATA_DIR. The repo's real discovery_data/manifest.json is
  # deliberately NOT repointed -- tests/test_cert01_grading_validator.py resolves
  # the real artifact through it.
  #
  # THE CHECK FAILS RATHER THAN SKIPS once GENIZAH_FINDINGS_BROWSER_CHECK is set:
  # missing Playwright or an empty base URL are failures, not skips. Do not
  # "fix" a red run here by unsetting that variable -- a gate that can silently
  # not run is worse than no gate, because it is trusted anyway.
  findings-browser-check:
    timeout-minutes: 20
    needs: lint-and-docs
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
      # A port of this job's own, so it can never collide with a default the
      # app might already be using elsewhere on the runner.
      GENIZAH_PORT: '8099'
      FINDINGS_BASE_URL: 'http://127.0.0.1:8099'
      FIXTURE_DIR: 'discovery-ci-fixture'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Qt runtime deps
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -r requirements-lock.txt
      # pytest and playwright are CI-only dev tools, NOT runtime deps -- neither
      # belongs in requirements.txt/requirements-lock.txt, which describe what
      # the web process itself needs. scripts/capture_atlas_html.py already
      # documents Playwright as an ad-hoc dev/ops tool for the same reason.
      - run: pip install pytest playwright
      - run: playwright install --with-deps chromium

      # Build the synthetic sidecar and PROVE it reaches the page before a
      # browser is ever launched: the script fails loudly if the loader refuses
      # it, or if either bucket comes back empty. Those are fixture/projection
      # problems, and diagnosing them here beats diagnosing them as a browser
      # timeout later.
      - name: Materialize the fixture discovery sidecar
        run: python scripts/ci_materialize_discovery_fixture.py --dest "$RUNNER_TEMP/$FIXTURE_DIR"

      - name: Start the web app against the fixture sidecar
        env:
          DISCOVERY_ENABLED: '1'
          NICEGUI_RELOAD: 'false'
          NICEGUI_SHOW: 'false'
        run: |
          export GENIZAH_DISCOVERY_DATA_DIR="$RUNNER_TEMP/$FIXTURE_DIR"
          python -m web.main > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"

      # Poll, never sleep-and-hope: a fixed sleep flakes when the app is slow and
      # wastes time when it is fast, and when the app fails to boot it hands the
      # browser check a dead port, which then fails with a message about the
      # browser instead of about the server.
      - name: Wait for the origin to actually serve
        run: python scripts/wait_for_http.py "$FINDINGS_BASE_URL/computed-identifications" --timeout 240

      - name: Real-browser actionability of the "more matches" control
        env:
          GENIZAH_FINDINGS_BROWSER_CHECK: '1'
          # From the job env, so the port lives in exactly one place: a browser
          # pointed at a different port than the server would fail as a dead
          # port, which reads as "the control broke".
          GENIZAH_FINDINGS_BROWSER_BASE_URL: ${{ env.FINDINGS_BASE_URL }}
        run: pytest tests/test_findings_page.py::test_real_browser_actionability_of_the_more_matches_control -v

      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Stop the web app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
          fi

  gui-tests:
    timeout-minutes: 20
    needs: lint-and-docs
    env:
      # Same headless-Qt requirement as the `tests` job: these tests construct a
      # real QApplication and dispatch widget events; offscreen is the documented
      # headless mode. Running them in a SEPARATE job = a fresh process with clean
      # process-global Qt state, which avoids the full-suite accumulation segfault.
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -r requirements-lock.txt
      - run: pip install pytest
      # ONE PROCESS PER FILE. Qt state is process-global and these desktop
      # tests leak it across test boundaries (a widget closed with
      # deleteLater() is only QUEUED for destruction; a worker QThread or
      # QTimer can post a queued call into a widget an earlier test already
      # closed). Nothing fires until something runs an event loop, and then it
      # all fires at once on objects whose Python wrappers are still live --
      # SIGSEGV, at a position that moves with the run. Per-file processes
      # bound a leak to its own file. This is the same isolation the `tests`,
      # `gui-tests`, `render-smoke-tests` and `atlas-bake-tests` split already
      # buys at coarser grain, one level finer; the underlying widget/worker
      # lifetime bug is desktop work tracked separately.
      - run: python scripts/run_gui_tests.py

  slow-tests:
    timeout-minutes: 30
    needs: lint-and-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Qt runtime deps
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -r requirements-lock.txt
      - run: pip install pytest
      # R2-#5 (78-REVIEWS.md): dedicated slow-tests gate. Runs Phase 78 soak tests
      # plus any other @pytest.mark.slow tests. Concern #7 preserved: the default
      # `tests` job above continues to run `pytest tests/` (no addopts filter), so
      # the existing tests/e2e/test_performance.py also runs there. This job is
      # ADDITIONAL coverage, NOT a replacement.
      - run: pytest -m slow tests/

  atlas-bake-tests:
    timeout-minutes: 20
    needs: lint-and-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      # Node is provisioned here (not needed by the Python bake tests
      # themselves) so the companion 133-04 golden JS-decode + DOM-XSS tests
      # -- also tagged `atlas_bake` under tests/atlas_bake/ -- can run in this
      # same dedicated job once that plan lands.
      - run: pip install -r requirements-lock.txt
      # Bake-time-only deps (Phase 133 ATLAS-01, scripts/build_atlas_asset.py)
      # -- deliberately NOT in requirements.txt/requirements-lock.txt; this
      # tooling never runs inside the web process.
      - run: pip install -r requirements-atlas-bake.txt
      - run: pip install pytest
      - run: pytest tests/atlas_bake -m atlas_bake
