name: Documentation Health Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - '**.py'  # Code changes might need doc updates
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run documentation health check
        run: python scripts/check_docs.py

      - name: Comment on PR if issues found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Documentation health check failed!**\n\nPlease run `python scripts/check_docs.py` locally and fix any issues before merging.\n\nSee `docs/DOCUMENTATION_MAINTENANCE.md` for guidance.'
            })
