<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 003 — the discovery findings page</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg-secondary);color:var(--text-primary);font-family:var(--font-sans);
  font-size:var(--text-sm);line-height:1.5;padding-top:112px}
[dir="rtl"]{font-family:var(--font-heb)}

#nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--bg-card);
  border-bottom:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
#nav .r{display:flex;gap:6px;padding:6px 10px;align-items:center;flex-wrap:wrap}
#nav .r+.r{border-top:1px solid var(--border-light)}
.vtab{border:1px solid var(--border-light);border-bottom:none;background:var(--bg-secondary);
  color:var(--text-secondary);padding:6px 11px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  cursor:pointer;font-size:var(--text-xs);font-family:inherit;transition:all .15s ease}
.vtab:hover{background:var(--bg-hover)}
.vtab.active{background:var(--bg-card);color:var(--primary-700);font-weight:700;
  border-color:var(--primary-600);border-bottom:2px solid var(--bg-card);margin-bottom:-1px}
#nav select,#nav button.ctl{font-family:inherit;font-size:var(--text-xs);padding:4px 8px;
  border-radius:var(--radius-sm);border:1px solid var(--border-medium);background:var(--bg-card);
  color:var(--text-primary);cursor:pointer}
#nav label.cl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-tertiary);font-weight:700}
button.ctl.on{background:var(--primary-600);color:#fff;border-color:var(--primary-700)}
#stage{margin:0 auto;transition:max-width .2s ease;padding:12px 10px 90px}
.spacer{flex:1}

.annot{display:none}
body.ann .annot{display:block;font-size:var(--text-xs);line-height:1.45;background:var(--bg-tertiary);
  border:1px dashed var(--accent-amber);color:var(--text-secondary);padding:6px 8px;
  border-radius:var(--radius-sm);margin:6px 0}
.annot b{color:var(--text-primary)} .annot code{font-family:var(--font-mono);font-size:11px}

/* ---- page chrome ---- */
.frame{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--shadow-md)}
.appbar{background:var(--bg-header);color:#fff;height:64px;display:flex;align-items:center;gap:14px;padding:0 14px}
.appbar .brand{font-weight:700}
.appbar .nl{display:flex;gap:11px;font-size:var(--text-xs);opacity:.9;flex-wrap:wrap}
.appbar .nl span.cur{font-weight:700;border-bottom:2px solid #fff}
.appbar .nl span.beta::after{content:' β';opacity:.7;font-size:9px}

.phead{padding:16px 16px 12px;border-bottom:1px solid var(--border-light)}
.phead h1{margin:0 0 4px;font-size:var(--text-2xl);color:var(--primary-800)}
.phead .sub{font-size:var(--text-sm);color:var(--text-secondary);max-width:70ch}
.phead .caveat{margin-top:8px;font-size:var(--text-xs);color:var(--text-muted);
  background:var(--bg-tertiary);border-inline-start:3px solid var(--accent-gold);
  padding:7px 9px;border-radius:var(--radius-sm)}

/* mode tabs — Phase 138 makes /leads a MODE of this page, not a second page */
.modes{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--border-light);flex-wrap:wrap}
.mode{padding:8px 13px;font-size:var(--text-sm);cursor:pointer;border:none;background:none;
  color:var(--text-secondary);font-family:inherit;border-bottom:2px solid transparent}
.mode:hover{color:var(--text-primary)}
.mode.on{color:var(--primary-700);font-weight:700;border-bottom-color:var(--primary-600)}
.mode.future{opacity:.5;cursor:not-allowed}
.mode .tag{font-size:9px;background:var(--border-medium);color:var(--text-inverse);
  padding:0 4px;border-radius:2px;margin-inline-start:4px;vertical-align:1px}

/* filters */
.fbar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;padding:11px 16px;
  background:var(--bg-secondary);border-bottom:1px solid var(--border-light)}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg-h{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary);
  font-weight:700;display:flex;align-items:center;gap:5px}
.fg-row{display:flex;gap:5px;flex-wrap:wrap}
.fchip{font-size:var(--text-xs);padding:3px 9px;border-radius:var(--radius-full);
  border:1px solid var(--border-medium);background:var(--bg-card);color:var(--text-secondary);
  cursor:pointer;font-family:inherit;transition:all .15s ease}
.fchip:hover{border-color:var(--primary-600)}
.fchip.on{background:var(--primary-600);border-color:var(--primary-700);color:#fff;font-weight:600}
.fchip .c{opacity:.75;font-size:10px;margin-inline-start:4px}
.fg.blocked{opacity:.55}
.fg.blocked .fchip{cursor:not-allowed;border-style:dashed}
.fg.blocked .fchip:hover{border-color:var(--border-medium)}
.needs{font-size:9px;text-transform:uppercase;letter-spacing:.03em;background:var(--accent-amber);
  color:var(--text-inverse);padding:0 5px;border-radius:2px}
.freset{font-size:var(--text-xs);color:var(--primary-700);background:none;border:none;
  cursor:pointer;text-decoration:underline;font-family:inherit;align-self:flex-end}

/* confidence — first and prominent (owner: "and more in the front") */
.fg.confgrp .fg-h{font-size:var(--text-xs);color:var(--text-primary);text-transform:none;letter-spacing:0}
.fchip.conf{font-size:var(--text-sm);padding:5px 14px;font-weight:600}
.fchip.conf.strong{border-color:var(--primary-600);color:var(--primary-700)}
.fchip.conf.strong.on{background:var(--primary-600);color:#fff}
.fchip.conf.medium{border-color:var(--accent-amber);color:var(--accent-amber)}
.fchip.conf.medium.on{background:var(--accent-amber);color:var(--text-inverse);border-color:var(--accent-amber)}
.fchip.conf.weak{border-color:var(--border-medium);color:var(--text-muted)}
.fchip.conf.weak.on{background:var(--text-muted);color:var(--bg-card);border-color:var(--text-muted)}
.qmark{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  border-radius:50%;border:1px solid var(--border-medium);color:var(--text-muted);
  font-size:9px;cursor:help;font-weight:700}
.qmark:hover{border-color:var(--primary-600);color:var(--primary-700)}

/* novelty — promoted to a prominent switch (owner: "more prominent") */
.fg.novgrp{order:-1}
.novrow{display:flex;align-items:center;gap:8px;background:var(--bg-card);
  border:1px solid var(--primary-600);border-radius:var(--radius-full);padding:4px 12px}
.fg.novgrp.blocked .novrow{border-color:var(--border-medium);border-style:dashed}
.novsw{position:relative;width:34px;height:18px;flex:0 0 34px;border-radius:9px;
  background:var(--border-medium);cursor:pointer;transition:background .15s ease}
.novsw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:transform .15s ease}
.novsw.on{background:var(--primary-600)}
.novsw.on::after{transform:translateX(16px)}
[dir="rtl"] .novsw.on::after{transform:translateX(-16px)}
.novlbl{font-size:var(--text-sm);font-weight:600;color:var(--text-primary)}
.fg.novgrp.blocked .novlbl{color:var(--text-muted);font-weight:400}

/* domain tree — the /catalog-browse shape */
.dtree{display:flex;flex-direction:column;gap:1px;max-height:210px;overflow:auto;
  border:1px solid var(--border-light);border-radius:var(--radius-sm);background:var(--bg-card);padding:3px}
.dgrp{display:flex;flex-direction:column;gap:1px}
.dnode{display:flex;align-items:center;gap:5px;width:100%;text-align:start;font-family:inherit;
  font-size:var(--text-xs);padding:3px 6px;border:none;background:none;color:var(--text-secondary);
  cursor:pointer;border-radius:var(--radius-sm)}
.dnode:hover{background:var(--bg-hover);color:var(--text-primary)}
.dnode.on{background:var(--primary-600);color:#fff;font-weight:700}
.dnode.leaf{padding-inline-start:22px;font-size:11px}
.dnode .c{margin-inline-start:auto;opacity:.7;font-size:10px}
.dnode .tw{width:11px;flex:0 0 11px;text-align:center;color:var(--text-tertiary);font-size:9px}
.dnode.on .tw,.dnode.on .c{color:#fff}
.fsel{font-family:inherit;font-size:var(--text-xs);padding:3px 6px;border:1px solid var(--border-medium);
  border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);
  max-width:100%;width:100%}

/* result bar */
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;
  border-bottom:1px solid var(--border-light);font-size:var(--text-xs);color:var(--text-secondary)}
.rbar b{color:var(--text-primary);font-size:var(--text-sm)}
.rbar select{font-family:inherit;font-size:var(--text-xs);padding:2px 6px;
  border:1px solid var(--border-medium);border-radius:var(--radius-sm);
  background:var(--bg-card);color:var(--text-primary)}

/* rows */
.rows{}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;
  border-bottom:1px solid var(--border-light);transition:background .15s ease}
.row:hover{background:var(--bg-hover)}
.row .main{flex:1;min-width:0}
.row .side{flex:0 0 auto;text-align:end;font-size:var(--text-xs);color:var(--text-muted);
  display:flex;flex-direction:column;gap:3px;align-items:flex-end}
@media (max-width:700px){ .row{flex-direction:column;gap:6px} .row .side{text-align:start;align-items:flex-start} }
.r-title{font-weight:700;color:var(--primary-700);text-decoration:none;font-size:var(--text-base)}
.r-title:hover{text-decoration:underline}
.r-sub{font-size:var(--text-xs);color:var(--text-secondary);margin-top:2px}
.r-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:var(--text-xs);
  color:var(--text-secondary);align-items:center}
.band{font-size:10px;font-weight:700;padding:1px 7px;border-radius:var(--radius-full);
  border:1px solid var(--border-medium);background:var(--bg-tertiary);color:var(--text-secondary)}
.dim{color:var(--text-muted)}
.band.conf-strong{border-color:var(--primary-600);color:var(--primary-700);background:var(--bg-active)}
.band.conf-medium{border-color:var(--accent-amber);color:var(--accent-amber)}
.band.conf-weak{border-color:var(--border-medium);color:var(--text-muted)}
.wchip{font-size:10px;background:var(--bg-secondary);border:1px solid var(--border-light);
  border-radius:var(--radius-full);padding:1px 7px;color:var(--text-secondary)}
.nov{font-size:10px;font-weight:700;padding:1px 7px;border-radius:var(--radius-full);
  border:1px solid var(--primary-600);color:var(--primary-700);background:var(--bg-active)}
.nov.unknown{border-color:var(--border-medium);color:var(--text-muted);background:var(--bg-tertiary);
  font-weight:400;font-style:italic}
.lbtn{font-size:var(--text-xs);color:var(--primary-700);background:none;
  border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:2px 8px;
  cursor:pointer;font-family:inherit}
.lbtn:hover{background:var(--bg-active);border-color:var(--primary-600)}
.lbtn[disabled]{opacity:.45;cursor:default}

.pager{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:var(--text-xs);
  color:var(--text-muted);flex-wrap:wrap}
.statebox{padding:34px 16px;text-align:center;font-size:var(--text-sm);color:var(--text-muted)}
.statebox.err{color:var(--error)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border-medium);
  border-top-color:var(--primary-600);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}

#toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text-primary);color:var(--bg-card);padding:8px 15px;border-radius:var(--radius-full);
  font-size:var(--text-xs);opacity:0;pointer-events:none;transition:all .2s ease;z-index:9999;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#tools{position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:11px;
  background:rgba(0,0,0,.78);color:#fff;padding:8px 10px;border-radius:8px;opacity:.35;
  transition:opacity .2s;display:flex;gap:6px;align-items:center}
#tools:hover{opacity:1}
#tools select{font-size:11px;font-family:inherit;padding:2px 6px;border-radius:4px;
  border:1px solid #555;background:#222;color:#fff}
</style>
</head>
<body>

<div id="nav">
  <div class="r">
    <button class="vtab active" onclick="setU('a',this)">A: one line per identification (65,200)</button>
    <button class="vtab" onclick="setU('b',this)">B: one line per manuscript (44,375)</button>
    <button class="vtab" onclick="setU('c',this)">C: one line per work (1,088)</button>
  </div>
  <div class="r">
    <label class="cl">Nav label</label>
    <select id="navlbl" onchange="render()">
      <option value="findings">Findings / ממצאים</option>
      <option value="computed">Computed Identifications / זיהויים מחושבים</option>
      <option value="matches">Text Matches / התאמות טקסט</option>
    </select>
    <label class="cl">State</label>
    <select id="st" onchange="render()">
      <option value="ready">ready</option>
      <option value="loading">loading</option>
      <option value="outage">outage</option>
      <option value="absent">sidecar absent / flag off</option>
    </select>
    <button class="ctl" id="rebuiltB" onclick="REBUILT=!REBUILT;render()">pretend rebuild has landed</button>
    <button class="ctl" id="langB" onclick="toggleLang()">עברית / RTL</button>
    <button class="ctl" id="annB" onclick="toggleAnn()">Design notes</button>
    <span class="spacer"></span>
    <label class="cl">Width</label>
    <button class="ctl" onclick="vp(375,this)">375</button>
    <button class="ctl" onclick="vp(768,this)">768</button>
    <button class="ctl on" onclick="vp(0,this)">Full</button>
  </div>
</div>

<div id="stage"></div>
<div id="toast"></div>
<div id="tools">
  <span>theme</span>
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">light</option><option value="parchment">parchment</option><option value="dark">dark</option>
  </select>
</div>

<script src="data.js"></script>
<script src="work-domains.js"></script>
<script>
/* ==========================================================================
   Sketch 003 — the corpus-wide discovery findings page (D-19).

   Its own page with its own nav entry, gated exactly as /atlas is (an
   availability predicate ANDed with the flag, not the flag alone).
   Phase 138's /leads becomes a MODE of this page, not a second implementation.

   All counts and rows are REAL, from the deployed discovery-v1-33499c5b asset.
   The three tabs are the OPEN decision CONTEXT.md asks for a mockup of.
   ========================================================================== */

const D = FINDINGS, TOT = D.totals;

const BAND_LABELS = {
  'high_confidence_algorithmic':{en:'High-confidence match (algorithmic)',he:'התאמה בוודאות גבוהה (אלגוריתמית)'},
  'tier_a':{en:'Algorithmic match — tier A',he:'התאמה אלגוריתמית — דרגה א׳'},
  'screening_rb':{en:'Screening — rule-based',he:'סינון — מבוסס כללים'},
  'screening_canon':{en:'Screening — canon',he:'סינון — קנון'},
  'corroborated':{en:'Corroborated by matching witnesses',he:'מאושש בעדים תואמים'},
  'weak':{en:'Matching witnesses (weak)',he:'עדים תואמים (חלש)'},
  'not_evaluated':{en:'Shared text — not evaluated',he:'טקסט משותף — לא הוערך'},
};
const NAVLBL = {
  findings:{en:'Findings',he:'ממצאים'},
  computed:{en:'Computed Identifications',he:'זיהויים מחושבים'},
  matches:{en:'Text Matches',he:'התאמות טקסט'},
};
const T = {
  en:{ h1:'Computed identifications across the corpus',
    sub:'Every text match the system computed between a Genizah folio and a known work, across the whole corpus. Filter by confidence tier; sort deterministically. Each row links to the manuscript and to the work.',
    caveat:'These are algorithmic text matches, not catalogued identifications. Nothing here has been reviewed. Not exhaustive — more matches may exist, and a text match is not by itself proof of identity.',
    modeAll:'All findings', modeLeads:'Screening leads', modeSaved:'My saved',
    tier:'Confidence tier', novelty:'Finding aids', coverage:'Page coverage', library:'Library',
    domain:'Domain', domainOfWork:'— of the identified work', allDomains:'All domains',
    author:'Author', work:'Work', anyAuthor:'Any author', anyWork:'Any work',
    confidence:'Confidence', cStrong:'Strong', cMedium:'Medium', cWeak:'Weak',
    cWhyStrong:'We think this folio may carry the same work.',
    cWhyMedium:'A long passage in common — more likely a citation than a copy.',
    cWhyWeak:'Everything else: short or generic overlap, screening candidates, and relations never assessed.',
    cHelp:'How sure the system is that this folio carries this work. Strong and Medium are shown by default; Weak and Not assessed are screening candidates. Nothing here has been reviewed by a person.',
    novToggle:'Not in the catalogues we checked', novHelp:'We checked a fixed, dated list of finding aids: the FJMS and NLI catalogues and bibliography, titles, PGP, FGP and shelfmark attributions. “Not in the catalogues we checked” means it was absent from THAT list — not that it is unknown to scholarship, and not that it is correct.',
    showAs:'Show as', asIdent:'One row per identification', asMs:'One row per manuscript', asWork:'One row per work',
    asIdentShort:'Identifications', asMsShort:'Manuscripts', asWorkShort:'Works',
    reset:'reset all', sortBy:'Sort', showing:(a,b,n)=>`${a}–${b} of ${n.toLocaleString()}`,
    sortTier:'Strongest tier first', sortPages:'Most pages', sortLetters:'Most matched text',
    prev:'‹ Previous', next:'Next ›',
    novNot:'Not found in the finding aids checked', novKnown:'Recorded in a reference source',
    novUnknown:'not checked',
    pages:n=>`${n} ${n===1?'page':'pages'}`, letters:n=>`${n.toLocaleString()} letters`,
    mss:n=>`${n.toLocaleString()} manuscripts`, works:n=>`${n} works`,
    openMs:'Open manuscript', openWork:'Open work page',
    loading:'Searching the corpus…', outage:'Findings are temporarily unavailable.',
    retry:'Retry', absent:'This page is not available on this server.',
    needsRebuild:'needs the rebuild',
    leadsFuture:'Phase 138', savedFuture:'Phase 137',
  },
  he:{ h1:'זיהויים מחושבים בכל האוסף',
    sub:'כל התאמת טקסט שהמערכת חישבה בין דף גניזה לחיבור מוכר, בכל האוסף. סינון לפי דרגת ודאות; מיון דטרמיניסטי. כל שורה מקשרת לכתב־היד ולחיבור.',
    caveat:'אלו התאמות טקסט אלגוריתמיות, לא זיהויים קטלוגיים. שום דבר כאן לא נבדק. אינו ממצה — ייתכנו התאמות נוספות, והתאמת טקסט אינה כשלעצמה הוכחת זהות.',
    modeAll:'כל הממצאים', modeLeads:'מועמדים לסינון', modeSaved:'השמורים שלי',
    tier:'דרגת ודאות', novelty:'אמצעי עזר', coverage:'כיסוי הדף', library:'ספרייה',
    domain:'תחום', domainOfWork:'— של החיבור המזוהה', allDomains:'כל התחומים',
    author:'מחבר', work:'חיבור', anyAuthor:'כל המחברים', anyWork:'כל החיבורים',
    confidence:'ודאות', cStrong:'חזקה', cMedium:'בינונית', cWeak:'חלשה',
    cWhyStrong:'אנו סבורים שהדף עשוי לשאת את אותו חיבור.',
    cWhyMedium:'קטע ארוך משותף — סביר יותר ציטוט מהעתקה.',
    cWhyWeak:'כל השאר: חפיפה קצרה או כללית, מועמדים לסינון, ויחסים שלא הוערכו.',
    cHelp:'עד כמה המערכת בטוחה שהדף נושא את החיבור. «חזקה» ו«בינונית» מוצגות כברירת מחדל; «חלשה» ו«לא הוערכה» הן מועמדות לסינון. שום דבר כאן לא נבדק בידי אדם.',
    novToggle:'לא באמצעי העזר שנבדקו', novHelp:'בדקנו רשימה קבועה ומתוארכת של אמצעי עזר: קטלוגי FJMS ו‑NLI והביבליוגרפיה, כותרים, PGP, FGP וייחוסי מדף. «לא באמצעי העזר שנבדקו» פירושו שהחיבור נעדר מאותה רשימה — לא שהוא בלתי מוכר למחקר, ולא שהזיהוי נכון.',
    showAs:'הצג לפי', asIdent:'שורה לכל זיהוי', asMs:'שורה לכל כתב־יד', asWork:'שורה לכל חיבור',
    asIdentShort:'זיהויים', asMsShort:'כתבי־יד', asWorkShort:'חיבורים',
    reset:'איפוס הכל', sortBy:'מיון', showing:(a,b,n)=>`${a}–${b} מתוך ${n.toLocaleString()}`,
    sortTier:'הדרגה החזקה תחילה', sortPages:'הכי הרבה דפים', sortLetters:'הכי הרבה טקסט מותאם',
    prev:'› הקודם', next:'הבא ‹',
    novNot:'לא נמצא באמצעי העזר שנבדקו', novKnown:'מתועד במקור עזר אחר',
    novUnknown:'לא נבדק',
    pages:n=>`${n} דפים`, letters:n=>`${n.toLocaleString()} אותיות`,
    mss:n=>`${n.toLocaleString()} כתבי־יד`, works:n=>`${n} חיבורים`,
    openMs:'פתח כתב־יד', openWork:'פתח עמוד חיבור',
    loading:'מחפש באוסף…', outage:'הממצאים אינם זמינים כרגע.',
    retry:'נסה שוב', absent:'הדף אינו זמין בשרת זה.',
    needsRebuild:'דורש את הבנייה מחדש',
    leadsFuture:'שלב 138', savedFuture:'שלב 137',
  }
};

const NOTES = {
  unit:'<b>THE OPEN DECISION (D-19).</b> CONTEXT.md recommends one line per identification but never counted it. Measured: <b>65,200</b> identifications (manuscript × work, deduped) vs 166,537 raw claims, 44,375 manuscripts, 1,088 works. Unit A is the only one where tier, coverage, novelty and the future vote all attach to exactly the thing on the line. Unit B collapses 9,806 multi-work manuscripts, so a novelty filter becomes ambiguous — is the MANUSCRIPT novel, or one of its works? Unit C is browsable at 1,088 rows but hides the individual find and lets giant works dominate by size.',
  novelty:'<b>The headline axis does not exist yet — and a naive filter would MISLEAD.</b> In the deployed asset only <code>propagated</code> rows carry a novelty verdict: 14,003 flagged, 8,240 not. All <b>144,294 direct rows sit at <code>is_new = 0</code></b>, which means UNCHECKED, not "already recorded". Shipping a two-state novelty filter over that data would tell the reader those 144,294 findings are already in the catalogues, which is false. This is exactly the coverage gap NOVEL-01 exists to close, and it is why the tri-state (<code>known</code> / <code>not_found</code> / <code>indeterminate</code>, D-23a) is not optional bookkeeping — it is the difference between an honest filter and a false claim. Press "pretend rebuild has landed" to see the intended state.',
  coverage:'<b>Coverage cannot be filtered or sorted today.</b> <code>coverage_ppm</code> does not exist as a column (verified via PRAGMA), and neither does <code>band_rank</code>. The metric IS computed during the bake and then discarded. So this control is inert until gate 1-3 land — which means the findings page is genuinely blocked on the rebuild, not merely improved by it.',
  perf:'<b>PERF-01 is a real blocker here, measured twice.</b> D-10a recorded 3.41-3.55 s for a representative novelty/tier/coverage ordering against a 1.5 s cap. Independently, the deduped identification COUNT for unit A took <b>16 s</b> in this extraction. A visible real total (which WORK-01 requires and this page wants) is therefore not free — it needs the materialized sort keys and indexes, or a cached/approximate count with honest wording.',
  nav:'<b>The nav label is constrained from three directions.</b> "Discoveries" is taken by the pre-existing Community page (<code>web/pages/discoveries.py</code>). "Browse by Identification" already exists in the nav for <code>/catalog-browse</code>, so a bare "Identifications" invites confusion between a catalogue browse and a computed-match list. And D-23b prohibits "new" / "new discovery" / "unknown to scholarship", so anything like "New Findings" is out. Switch the dropdown to compare the three survivors.',
  modes:'<b>Modes, not pages.</b> The roadmap records that Phase 138\'s <code>/leads</code> is a MODE of this page rather than a second implementation, and Phase 137 adds saved judgments. Designing the mode strip now means 138 and 137 add a tab instead of a page — and it keeps one filter/sort/paging implementation. The greyed tabs are deliberately non-functional here.',
  domainmap:'<b>Domain is the domain of the IDENTIFIED WORK, not of the manuscript (owner, 2026-07-31).</b> This matters. The FJMS catalogue classifies the <i>shelfmark</i>, and it joins cleanly on <code>sys_id == AlmaId</code> at 83% coverage (37,027 of 44,375 findings-bearing manuscripts) — so the manuscript route was tempting and free. But it is the wrong axis and actively harmful here: Moss. V,374 is catalogued <i>Court Documents / Court Records</i> while carrying a verifiably correct <b>Rashi on Esther</b> finding. Filtering by manuscript domain would hide precisely the findings that disagree with the catalogue, which are the most interesting ones — 338 tier-A findings sit on manuscripts catalogued documentary/legal. So each WORK is assigned its own domain, once, from the same FJMS vocabulary the catalogue browse already uses (39 parents / 202 leaves, bilingual).',
  cascade:'<b>The cascade is /catalog-browse\'s, deliberately.</b> Collapsible domain tree, then author narrowed by domain, then work narrowed by domain + author — mirroring <code>fjms.get_browse_authors(domain)</code> and <code>fjms.get_browse_works(domain, author)</code>. Two of the three facets need NO new mapping: author is already in the asset for 520 of 1,088 works (only 96 distinct strings, 81% matching FJMS persons), and the <b>work facet IS the discovery work vocabulary</b> — it does not need bridging to FJMS <code>genizah_titles</code>, which matched only 5% (55 of 935) and would have been the expensive part. Only DOMAIN needs the one-time pass.',
  sample:'<b>The domain data here is a 93-work feasibility sample, not the full map.</b> Assigning it took one pass with no external lookups: <b>90 of 93 at high confidence (96%)</b>. The 3 low-confidence cases are a literary letter collection, an Arabic Josippon (the vocabulary has no history leaf), and a kalam-vs-theology judgement. Extrapolated, the full pass over ~1,088 works is a bounded agent task with roughly 3-4% needing a web lookup or an owner ruling — and it surfaces data-quality fixes for free (Hovot ha-Levavot is attributed to the wrong Bahya in the asset).',
  gate:'<b>Gated like /atlas, not by the flag alone.</b> The page, its data routes and its nav entry all check an availability predicate ANDed with <code>DISCOVERY_ENABLED</code>, so a flag-on/sidecar-missing window still hides cleanly. Switch State to "sidecar absent / flag off": the correct behaviour is that the nav entry disappears entirely, not that the page renders empty.',
  sort:'<b>Novelty must never order the list (D-15a / D-24).</b> Default sort is tier-first. Novelty is a filter — and optionally a user-selected grouping — but it never changes confidence rank or styling, because absence from a finding aid is not evidence a match is correct. Note the sort dropdown offers no novelty option, deliberately.',
};

let U='a', LANG='en', PAGE=0, REBUILT=false, MODE='all';
let fConf=new Set(), fNov=new Set();
let fParent=null, fDomain=null, fAuthor=null, fWork=null;   // /catalog-browse cascade
let openParents=new Set();
const PER=12;

/* ---- the work -> FJMS domain map (owner's decision: domain of the IDENTIFIED
   WORK, never the manuscript's catalogue domain — the catalogue classifies the
   shelfmark, so on Moss. V,374 it says "Court Records" while the finding is
   Rashi on Esther, and filtering on it would hide exactly the findings that
   disagree with the catalogue). ---- */
const domOf   = wid => WORK_DOMAINS[wid] || null;
const parentOf= wid => (domOf(wid)||{}).parent || null;
const leafOf  = wid => (domOf(wid)||{}).domain || null;
const authorOf= wid => ((D.works[wid]||{}).author || '').trim();
/* a row's work id — unit B rows are manuscript-level and have no single work */
const widOf = r => r.wid || null;
const t=()=>T[LANG];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bandLbl=b=>BAND_LABELS[b]?BAND_LABELS[b][LANG]:b;

/* ---- Confidence scale (owner, 2026-07-31): it describes WHAT KIND OF CLAIM
   this is, not which internal band it landed in.
     strong = we think it may be the SAME WORK -> direct_witness in a strong band
     medium = a long citation-type match       -> quotes_this_work, >= LONG letters
     weak   = the rest
   Measured on the deployed asset: strong 131,164 (78.8%) / medium 3,501 (2.1%)
   / weak 31,872 (19.1%). LONG = 200 sits just above D-13c's 150-letter
   short-passage cutoff, so the two thresholds are consistent; carry it as a
   gate-1 tunable exactly like D-13c.
   NOTE: needs a dated amendment to discovery-band-labels-v1.md §2 — the precise
   band label stays available on hover and on the methods page. ---- */
const LONG_CITATION = 200;
const STRONG_BANDS = new Set(['tier_a','high_confidence_algorithmic']);
function confOf(r){
  if (r.ctype==='direct_witness' && STRONG_BANDS.has(r.band)) return 'strong';
  if (r.ctype==='quotes_this_work' && (r.maxLetters||0) >= LONG_CITATION) return 'medium';
  return 'weak';
}
const CONF_ORDER=['strong','medium','weak'];
const confLbl=c=>({strong:t().cStrong,medium:t().cMedium,weak:t().cWeak}[c]);
const confWhyText=c=>({strong:t().cWhyStrong,medium:t().cWhyMedium,weak:t().cWhyWeak}[c]);
const note=k=>NOTES[k]?`<div class="annot">${NOTES[k]}</div>`:'';
const sm=id=>(D.libs[id]||{}).sm||id;
const lib=id=>(D.libs[id]||{}).lib||'';
const wtitle=id=>(D.works[id]||{}).title||id;
const wauthor=id=>(D.works[id]||{}).author||'';
const state=()=>document.getElementById('st').value;

/* novelty verdict for a row, honest about the coverage gap */
function novOf(r){
  if (REBUILT) return r.isNew===1?'not_found':(r.isNew===0&&r.src==='propagated'?'known':'not_found');
  if (r.src==='propagated') return r.isNew===1?'not_found':'known';
  return 'indeterminate';                       // 144,294 direct rows: UNCHECKED
}
function novChip(r){
  const L=t(), v=novOf(r);
  if (v==='not_found') return `<span class="nov">${esc(L.novNot)}</span>`;
  if (v==='known')     return `<span class="nov unknown">${esc(L.novKnown)}</span>`;
  return `<span class="nov unknown">${esc(L.novUnknown)}</span>`;
}

/* ---------- filtering ---------- */
const confOK=r=>fConf.size===0||fConf.has(confOf(r));
const novOK=r=>fNov.size===0||fNov.has(novOf(r));

/* reverse title -> work id, so unit B (manuscript rows) can be filtered by the
   domains of the works found on it */
const TITLE2WID={}; Object.entries(D.works).forEach(([w,v])=>{ TITLE2WID[v.title]=w; });
const widsOfRow=r=>{
  if (r.wid) return [r.wid];
  const ts=(D.msWorks[r.sysId]||[]);
  return ts.map(t=>TITLE2WID[t]).filter(Boolean);
};
const domainOK=r=>{
  if(!fParent && !fDomain) return true;
  return widsOfRow(r).some(w=>{
    const d=domOf(w); if(!d) return false;
    if(fDomain) return d.domain===fDomain;
    return d.parent===fParent;
  });
};
const authorOK=r=>!fAuthor || widsOfRow(r).some(w=>authorOf(w)===fAuthor);
const workOK  =r=>!fWork   || widsOfRow(r).includes(fWork);

function rowsFor(u){
  const src = u==='a'?D.unitA : u==='b'?D.unitB : D.unitC;
  return src.filter(r=>confOK(r) && domainOK(r) && authorOK(r) && workOK(r)
                       && (u==='c'?true:novOK(r)));
}

/* cross-filtered facet lists, exactly the /catalog-browse cascade:
   authors narrow to the chosen domain; works narrow to domain + author */
function authorsFor(u){
  const seen={};
  rowsFor(u).forEach(r=>widsOfRow(r).forEach(w=>{
    const a=authorOf(w); if(!a) return;
    if(fDomain && leafOf(w)!==fDomain) return;
    if(fParent && !fDomain && parentOf(w)!==fParent) return;
    seen[a]=(seen[a]||0)+1;
  }));
  return Object.entries(seen).sort((x,y)=>y[1]-x[1]);
}
function worksFor(u){
  const seen={};
  rowsFor(u).forEach(r=>widsOfRow(r).forEach(w=>{
    if(fDomain && leafOf(w)!==fDomain) return;
    if(fParent && !fDomain && parentOf(w)!==fParent) return;
    if(fAuthor && authorOf(w)!==fAuthor) return;
    seen[w]=(seen[w]||0)+1;
  }));
  return Object.entries(seen).sort((x,y)=>y[1]-x[1]);
}
function totalFor(u){
  const base = u==='a'?TOT.identifications : u==='b'?TOT.manuscripts : TOT.works;
  if (fConf.size===0 && fNov.size===0) return base;
  // proportional estimate from the sample, clearly a sketch affordance
  const src = u==='a'?D.unitA : u==='b'?D.unitB : D.unitC;
  return Math.max(rowsFor(u).length, Math.round(base * rowsFor(u).length / Math.max(1,src.length)));
}

/* domain tree — the same collapsible parent/leaf shape /catalog-browse uses */
function domainTree(u){
  const L=t();
  const cnt={}, pcnt={};
  const src = u==='a'?D.unitA : u==='b'?D.unitB : D.unitC;
  src.forEach(r=>widsOfRow(r).forEach(w=>{
    const d=domOf(w); if(!d) return;
    pcnt[d.parent]=(pcnt[d.parent]||0)+1; cnt[d.domain]=(cnt[d.domain]||0)+1;
  }));
  const parents=Object.keys(DOMAIN_TREE).filter(p=>pcnt[p]).sort((a,b)=>pcnt[b]-pcnt[a]);
  return `<div class="dtree">
    <button class="dnode ${!fParent&&!fDomain?'on':''}" onclick="pickDomain(null,null)">${esc(L.allDomains)}</button>
    ${parents.map(p=>{
      const open=openParents.has(p), node=DOMAIN_TREE[p];
      const kids=node.children.filter(c=>cnt[c.en]);
      return `<div class="dgrp">
        <button class="dnode ${fParent===p&&!fDomain?'on':''}" onclick="pickDomain('${esc(p)}',null)">
          <span class="tw" onclick="event.stopPropagation();togP('${esc(p)}')">${kids.length?(open?'▾':'▸'):'·'}</span>
          ${esc(LANG==='he'&&node.he?node.he:p)}<span class="c">${pcnt[p]}</span></button>
        ${open?kids.map(c=>`<button class="dnode leaf ${fDomain===c.en?'on':''}"
            onclick="pickDomain('${esc(p)}','${esc(c.en)}')">${esc(LANG==='he'&&c.he?c.he:c.en)}<span class="c">${cnt[c.en]}</span></button>`).join(''):''}
      </div>`;
    }).join('')}
  </div>`;
}

function filterBar(){
  const L=t();
  /* real corpus counts, mapped through the same rule as the rows */
  const confCounts={strong:131164, medium:3501, weak:31872};
  const active=fConf.size||fNov.size||fParent||fDomain||fAuthor||fWork;
  const auth=authorsFor(U), wks=worksFor(U);
  return `<div class="fbar">
    <div class="fg" style="flex:1 1 240px;max-width:340px">
      <div class="fg-h">${esc(L.domain)} <span class="dim" style="font-weight:400;text-transform:none;letter-spacing:0">${esc(L.domainOfWork)}</span></div>
      ${domainTree(U)}
    </div>
    <div class="fg" style="min-width:190px">
      <div class="fg-h">${esc(L.author)}</div>
      <select class="fsel" onchange="fAuthor=this.value||null;fWork=null;PAGE=0;render()">
        <option value="">${esc(L.anyAuthor)} (${auth.length})</option>
        ${auth.map(([a,n])=>`<option value="${esc(a)}" ${fAuthor===a?'selected':''}>${esc(a)} (${n})</option>`).join('')}
      </select>
      <div class="fg-h" style="margin-top:6px">${esc(L.work)}</div>
      <select class="fsel" onchange="fWork=this.value||null;PAGE=0;render()">
        <option value="">${esc(L.anyWork)} (${wks.length})</option>
        ${wks.map(([w,n])=>`<option value="${esc(w)}" ${fWork===w?'selected':''}>${esc((D.works[w]||{}).title||w)} (${n})</option>`).join('')}
      </select>
      ${note('cascade')}
    </div>
    <div class="fg confgrp">
      <div class="fg-h">${esc(L.confidence)} <span class="qmark" title="${esc(L.cHelp)}">?</span></div>
      <div class="fg-row">${CONF_ORDER.map(c=>`<button class="fchip conf ${c} ${fConf.has(c)?'on':''}"
        onclick="tB('${c}')" title="${esc(confWhyText(c))}">${esc(confLbl(c))}<span class="c">${(confCounts[c]||0).toLocaleString()}</span></button>`).join('')}</div>
    </div>
    <div class="fg ${REBUILT?'':'blocked'}">
      <div class="fg-h">${esc(L.novelty)} ${REBUILT?'':`<span class="needs">${esc(L.needsRebuild)}</span>`}</div>
      <div class="fg-row">
        <button class="fchip ${fNov.has('not_found')?'on':''}" ${REBUILT?`onclick="tN('not_found')"`:''}>${esc(L.novNot)}</button>
        <button class="fchip ${fNov.has('known')?'on':''}" ${REBUILT?`onclick="tN('known')"`:''}>${esc(L.novKnown)}</button>
        <button class="fchip ${fNov.has('indeterminate')?'on':''}" ${REBUILT?`onclick="tN('indeterminate')"`:''}>${esc(L.novUnknown)}</button>
      </div>
    </div>
    <div class="fg blocked">
      <div class="fg-h">${esc(L.coverage)} <span class="needs">${esc(L.needsRebuild)}</span></div>
      <div class="fg-row"><button class="fchip">≥ 25%</button><button class="fchip">≥ 50%</button><button class="fchip">≥ 75%</button></div>
    </div>
    ${active?`<button class="freset" onclick="clearAll()">${esc(L.reset)}</button>`:''}
  </div>
  ${note('domainmap')}${note('novelty')}${note('coverage')}`;
}
function tB(c){ fConf.has(c)?fConf.delete(c):fConf.add(c); PAGE=0; render(); }
function tN(v){ fNov.has(v)?fNov.delete(v):fNov.add(v); PAGE=0; render(); }
function pickDomain(p,d){ fParent=p; fDomain=d; fAuthor=null; fWork=null; PAGE=0;
  if(p) openParents.add(p); render(); }
function togP(p){ openParents.has(p)?openParents.delete(p):openParents.add(p); render(); }
function clearAll(){ fConf.clear(); fNov.clear(); fParent=fDomain=fAuthor=fWork=null; PAGE=0; render(); }

/* ---------- rows per unit ---------- */
function rowA(r){
  const L=t();
  return `<div class="row"><div class="main">
    <a class="r-title" href="#" onclick="toast('→ /work/'+'${r.wid}');return false;">${esc(wtitle(r.wid))}</a>
    <div class="r-sub">${esc(lib(r.sysId))}, <a class="r-title" style="font-size:var(--text-sm)" href="#"
      onclick="toast('→ /browse ${esc(sm(r.sysId))}');return false;">${esc(sm(r.sysId))}</a>
      ${wauthor(r.wid)?`<span class="dim"> · ${esc(wauthor(r.wid))}</span>`:''}</div>
    <div class="r-meta"><span class="band">${esc(bandLbl(r.band))}</span>${novChip(r)}
      <span class="dim">${L.pages(r.pages)}</span>
      ${r.letters?`<span class="dim">· ${L.letters(r.letters)}</span>`:''}</div>
  </div><div class="side">
    <button class="lbtn" onclick="toast('→ /browse')">${esc(L.openMs)}</button>
    <button class="lbtn" onclick="toast('→ /work/'+'${r.wid}')">${esc(L.openWork)}</button>
  </div></div>`;
}
function rowB(r){
  const L=t(), ws=(D.msWorks[r.sysId]||[]);
  return `<div class="row"><div class="main">
    <a class="r-title" href="#" onclick="toast('→ /browse ${esc(sm(r.sysId))}');return false;">${esc(lib(r.sysId))}, ${esc(sm(r.sysId))}</a>
    <div class="r-meta" style="margin-top:4px">${ws.slice(0,5).map(w=>`<span class="wchip">${esc(w)}</span>`).join('')}
      ${r.works>5?`<span class="dim">+${r.works-5}</span>`:''}</div>
    <div class="r-meta"><span class="band">${esc(bandLbl(r.band))}</span>${novChip(r)}
      <span class="dim">${L.works(r.works)} · ${L.pages(r.pages)}</span></div>
  </div><div class="side"><button class="lbtn" onclick="toast('→ /browse')">${esc(L.openMs)}</button></div></div>
  ${r.works>1?`<div class="annot">Multi-work manuscript (${r.works} works). Which work is the novelty verdict about? This is unit B's ambiguity — 9,806 manuscripts are like this.</div>`:''}`;
}
function rowC(r){
  const L=t();
  return `<div class="row"><div class="main">
    <a class="r-title" href="#" onclick="toast('→ /work/'+'${r.wid}');return false;">${esc(wtitle(r.wid))}</a>
    ${wauthor(r.wid)?`<div class="r-sub">${esc(wauthor(r.wid))}</div>`:''}
    <div class="r-meta"><span class="band">${esc(bandLbl(r.band))}</span>
      <span class="dim">${L.mss(r.mss)} · ${L.pages(r.pages)}</span></div>
  </div><div class="side"><button class="lbtn" onclick="toast('→ /work/'+'${r.wid}')">${esc(L.openWork)}</button></div></div>`;
}

/* ---------- page ---------- */
function body(){
  const L=t(), st=state();
  if (st==='loading') return `<div class="statebox"><span class="spin"></span>${esc(L.loading)}</div>`;
  if (st==='outage') return `<div class="statebox err">⚠ ${esc(L.outage)}
    <div style="margin-top:9px"><button class="lbtn" onclick="document.getElementById('st').value='ready';render()">${esc(L.retry)}</button></div></div>`;
  const rows=rowsFor(U), total=totalFor(U);
  const maxPage=Math.max(0,Math.ceil(rows.length/PER)-1), p=Math.min(PAGE,maxPage);
  const slice=rows.slice(p*PER,p*PER+PER);
  const from=total?p*PER+1:0, to=Math.min(total,p*PER+slice.length);
  return `<div class="rbar">
      <b>${L.showing(from,to,total)}</b>
      <span class="spacer"></span>
      <label class="dim">${esc(L.sortBy)}</label>
      <select onchange="toast('sort → '+this.value)">
        <option>${esc(L.sortTier)}</option><option>${esc(L.sortPages)}</option><option>${esc(L.sortLetters)}</option>
      </select>
    </div>
    ${note('sort')}${note('perf')}
    <div class="rows">${slice.map(U==='a'?rowA:U==='b'?rowB:rowC).join('')}</div>
    <div class="pager">
      <button class="lbtn" ${p<=0?'disabled':''} onclick="PAGE=${p-1};render()">${esc(L.prev)}</button>
      <span>${p+1} / ${maxPage+1} <span class="dim">(sample)</span></span>
      <button class="lbtn" ${p>=maxPage?'disabled':''} onclick="PAGE=${p+1};render()">${esc(L.next)}</button>
    </div>`;
}

function render(){
  const L=t(), dir=LANG==='he'?'rtl':'ltr', st=state();
  const lblKey=document.getElementById('navlbl').value, lbl=NAVLBL[lblKey][LANG];
  document.getElementById('rebuiltB').classList.toggle('on',REBUILT);
  const hidden = st==='absent';
  document.getElementById('stage').innerHTML=`
  <div class="frame" dir="${dir}">
    <div class="appbar"><span class="brand">Dicta Genizah Search</span>
      <span class="nl"><span>${LANG==='he'?'בית':'Home'}</span><span>${LANG==='he'?'חיפוש':'Search'}</span>
        <span>${LANG==='he'?'מצא מקבילות':'Find Parallels'}</span>
        <span>${LANG==='he'?'עיון לפי מדף':'Browse by Shelfmark'}</span>
        <span>${LANG==='he'?'עיון לפי זיהוי':'Browse by Identification'}</span>
        <span>${LANG==='he'?'קהילה':'Community'}</span>
        <span class="beta">${LANG==='he'?'אטלס הגניזה':'The Genizah Atlas'}</span>
        ${hidden?'':`<span class="cur beta">${esc(lbl)}</span>`}</span></div>
    ${hidden?`<div class="statebox">${esc(L.absent)}<div class="dim" style="margin-top:8px;font-size:var(--text-xs)">
        — and the nav entry above is gone entirely, not greyed out</div></div>`
    :`<div class="phead"><h1>${esc(L.h1)}</h1>
        <div class="sub">${esc(L.sub)}</div>
        <div class="caveat">${esc(L.caveat)}</div></div>
      <div class="modes">
        <button class="mode on">${esc(L.modeAll)}</button>
        <button class="mode future" title="Phase 138">${esc(L.modeLeads)}<span class="tag">${esc(L.leadsFuture)}</span></button>
        <button class="mode future" title="Phase 137">${esc(L.modeSaved)}<span class="tag">${esc(L.savedFuture)}</span></button>
      </div>
      ${filterBar()}${body()}`}
  </div>
  ${note('unit')}${note('sample')}${note('nav')}${note('modes')}${note('gate')}`;
}

function setU(u,el){ U=u; PAGE=0;
  document.querySelectorAll('.vtab').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render(); }
function toggleLang(){ LANG=LANG==='en'?'he':'en';
  const b=document.getElementById('langB');
  b.textContent=LANG==='en'?'עברית / RTL':'English / LTR'; b.classList.toggle('on',LANG==='he'); render(); }
function toggleAnn(){ document.body.classList.toggle('ann');
  document.getElementById('annB').classList.toggle('on',document.body.classList.contains('ann')); }
function vp(w,el){ document.querySelectorAll('#nav .r:last-child button.ctl').forEach(b=>{
    if(/^\d+$|^Full$/.test(b.textContent)) b.classList.remove('on'); });
  el.classList.add('on'); document.getElementById('stage').style.maxWidth=w?w+'px':''; }
let tt; function toast(m){ const e=document.getElementById('toast'); e.textContent=m;
  e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),2200); }

render();
</script>
</body>
</html>
