<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 001 — Discovery panel architecture</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  line-height: 1.5;
  padding-top: 96px;
}
[dir="rtl"] { font-family: var(--font-heb); }

/* ---------- sketch chrome ---------- */
#variant-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
  background: var(--bg-card); border-bottom: 1px solid var(--border-light);
  box-shadow: var(--shadow-sm);
}
#variant-nav .row1 { display: flex; gap: 4px; padding: 6px 10px 0; flex-wrap: wrap; }
#variant-nav .row2 {
  display: flex; gap: 8px; padding: 6px 10px; align-items: center;
  flex-wrap: wrap; border-top: 1px solid var(--border-light); margin-top: 6px;
}
.variant-tab {
  border: 1px solid var(--border-light); border-bottom: none;
  background: var(--bg-secondary); color: var(--text-secondary);
  padding: 6px 12px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  cursor: pointer; font-size: var(--text-xs); font-family: inherit;
  transition: all 0.15s ease;
}
.variant-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.variant-tab.active {
  background: var(--bg-card); color: var(--primary-700);
  font-weight: 700; border-color: var(--primary-600);
  border-bottom: 2px solid var(--bg-card); margin-bottom: -1px;
}
#variant-nav select, #variant-nav button.ctl {
  font-family: inherit; font-size: var(--text-xs);
  padding: 4px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-medium);
  background: var(--bg-card); color: var(--text-primary); cursor: pointer;
}
#variant-nav label.ctl-label {
  font-size: var(--text-xs); color: var(--text-muted); margin-inline-end: 2px;
}
button.ctl.on { background: var(--primary-600); color: #fff; border-color: var(--primary-700); }

#stage { margin: 0 auto; transition: max-width 0.2s ease; padding: 16px 10px 80px; }
.ms-note {
  font-size: var(--text-xs); color: var(--text-muted);
  background: var(--bg-tertiary); border-inline-start: 3px solid var(--accent-gold);
  padding: 8px 10px; border-radius: var(--radius-sm); margin-bottom: 12px;
}

/* ---------- annotations ---------- */
.annot { display: none; }
body.show-annot .annot {
  display: block;
  font-size: var(--text-xs); line-height: 1.45;
  background: color-mix(in srgb, var(--accent-amber) 12%, var(--bg-card));
  border: 1px dashed var(--accent-amber);
  color: var(--text-secondary);
  padding: 6px 8px; border-radius: var(--radius-sm); margin: 6px 0;
}
.annot b { color: var(--text-primary); }

/* ---------- the browse-page frame (context only) ---------- */
.browse-frame {
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
}
.browse-head { background: var(--bg-header); color: #fff; padding: 10px 14px; }
.browse-head .sm { font-weight: 700; font-size: var(--text-base); }
.browse-head .lib { opacity: 0.85; font-size: var(--text-xs); }
.browse-body { padding: 12px 14px; }
.cat-line { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 4px; }
.cat-scope-warn {
  display: inline-block; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--text-inverse);
  background: var(--accent-amber); padding: 1px 6px;
  border-radius: var(--radius-full); margin-inline-end: 6px; vertical-align: 2px;
}

/* ---------- the panel ---------- */
.panel { border: 1px solid var(--border-light); border-radius: var(--radius-md); overflow: hidden; }
.panel-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--bg-active);
  border-bottom: 1px solid var(--border-light);
}
.panel-head .ico { color: var(--primary-700); font-size: var(--text-lg); line-height: 1; }
.panel-title { font-weight: 700; color: var(--primary-800); font-size: var(--text-base); }
.panel-count {
  font-size: var(--text-xs); color: var(--text-inverse);
  background: var(--primary-600); border-radius: var(--radius-full); padding: 1px 8px;
}
.panel-caveat {
  font-size: var(--text-xs); color: var(--text-muted);
  padding: 6px 12px; background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-light);
}
.panel-body { padding: 4px 0; background: var(--bg-card); }

.group-head {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px 4px; font-size: var(--text-xs);
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-tertiary); font-weight: 700;
}
.group-head .n { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-muted); }

/* identification row */
.idrow {
  padding: 10px 12px; border-top: 1px solid var(--border-light);
  transition: background 0.15s ease;
}
.idrow:hover { background: var(--bg-hover); }
.idrow.low-cov { border-inline-start: 3px solid var(--accent-amber); }
.idrow-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.idrow-verb { color: var(--text-muted); font-size: var(--text-xs); }
.idrow-work {
  font-weight: 700; color: var(--primary-700);
  font-size: var(--text-base); text-decoration: none;
}
.idrow-work:hover { text-decoration: underline; }
.idrow-author { color: var(--text-muted); font-size: var(--text-xs); }
.idrow-meta {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-top: 5px; font-size: var(--text-xs); color: var(--text-secondary);
}
.band {
  font-size: 11px; font-weight: 700; padding: 1px 7px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-medium); color: var(--text-secondary);
  background: var(--bg-tertiary);
}
.cov { color: var(--text-secondary); }
.cov b { color: var(--text-primary); }
.nocov { color: var(--text-muted); font-style: italic; }
.stamp { color: var(--text-muted); }
.offs { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.idrow-acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.linkbtn {
  font-size: var(--text-xs); color: var(--primary-700); background: none;
  border: 1px solid var(--border-light); border-radius: var(--radius-sm);
  padding: 3px 8px; cursor: pointer; font-family: inherit; transition: all 0.15s ease;
}
.linkbtn:hover { background: var(--bg-active); border-color: var(--primary-600); }
.vote { display: inline-flex; gap: 2px; margin-inline-start: auto; }
.vote button {
  width: 26px; height: 24px; font-size: var(--text-xs); cursor: pointer;
  border: 1px solid var(--border-light); background: var(--bg-card);
  color: var(--text-muted); border-radius: var(--radius-sm); font-family: inherit;
  transition: all 0.15s ease;
}
.vote button:hover { border-color: var(--primary-600); color: var(--primary-700); background: var(--bg-active); }
.vote .ph { font-size: 10px; color: var(--text-tertiary); align-self: center; margin-inline-start: 4px; }

.sub {
  margin-top: 6px; padding-inline-start: 14px;
  font-size: var(--text-xs); color: var(--text-secondary);
  border-inline-start: 2px solid var(--border-light);
}

/* witness expansion */
.witnesses { margin-top: 8px; background: var(--bg-secondary); border-radius: var(--radius-sm); padding: 8px 10px; }
.witnesses .w { display: flex; gap: 8px; padding: 3px 0; font-size: var(--text-xs); align-items: baseline; }
.witnesses .w .sm { color: var(--primary-700); }
.witnesses .w .lb { color: var(--text-muted); font-size: 11px; }
.spinner {
  display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border-medium);
  border-top-color: var(--primary-600); border-radius: 50%; animation: spin 0.7s linear infinite;
  vertical-align: -2px; margin-inline-end: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* disclosure sections */
.disc { border-top: 1px solid var(--border-light); }
.disc > summary {
  cursor: pointer; padding: 9px 12px; font-size: var(--text-sm);
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  color: var(--text-primary); transition: background 0.15s ease;
}
.disc > summary:hover { background: var(--bg-hover); }
.disc > summary::-webkit-details-marker { display: none; }
.disc > summary::before {
  content: '▸'; color: var(--text-tertiary); font-size: 10px;
  transition: transform 0.15s ease; display: inline-block;
}
.disc[open] > summary::before { transform: rotate(90deg); }
[dir="rtl"] .disc > summary::before { content: '◂'; }
[dir="rtl"] .disc[open] > summary::before { transform: rotate(-90deg); }
.disc .sc { font-size: var(--text-xs); color: var(--text-muted); }
.disc .qual { font-size: var(--text-xs); color: var(--text-tertiary); font-style: italic; }
.disc-body { padding: 2px 12px 12px; }
.disc.notid > summary { background: var(--bg-tertiary); }
.disc.notid .disc-body { border-inline-start: 3px solid var(--border-medium); margin-inline-start: 12px; padding-inline-start: 10px; }

.spangroup { font-size: var(--text-xs); color: var(--text-secondary); padding: 6px 0; }
.spangroup .works { color: var(--text-primary); font-weight: 600; }

/* elsewhere: named works (D-13h) */
.workchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.workchip {
  display: inline-flex; align-items: baseline; gap: 5px;
  font-size: var(--text-xs); background: var(--bg-secondary);
  border: 1px solid var(--border-light); border-radius: var(--radius-full);
  padding: 3px 10px; cursor: pointer; transition: all 0.15s ease;
}
.workchip:hover { border-color: var(--primary-600); background: var(--bg-active); }
.workchip .pg { color: var(--text-muted); font-size: 11px; }
.workchip.here { border-color: var(--primary-600); background: var(--bg-active); font-weight: 700; }
.workchip.gated { border-style: dashed; opacity: 0.75; }
.pager { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: var(--text-xs); color: var(--text-muted); }
.pager button { font-family: inherit; }

/* variant B synthesis block */
.synth {
  margin: 0; padding: 12px; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-light);
}
.synth-h {
  font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-tertiary); font-weight: 700; margin-bottom: 2px;
}
.synth-lead { font-size: var(--text-sm); color: var(--text-primary); margin-bottom: 6px; }
.synth-lead b { color: var(--primary-700); }

/* variant C rail */
.cwrap { display: block; }
.rail {
  background: var(--bg-secondary); border-top: 1px solid var(--border-light);
  padding: 10px 12px;
}
.rail-h {
  font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-tertiary); font-weight: 700; margin-bottom: 6px;
}
@media (min-width: 900px) {
  .cwrap { display: grid; grid-template-columns: 1fr 260px; }
  .rail { border-top: none; border-inline-start: 1px solid var(--border-light); }
  [dir="rtl"] .rail { border-inline-start: none; border-inline-end: 1px solid var(--border-light); }
}

/* toast */
#toast {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text-primary); color: var(--bg-card);
  padding: 8px 16px; border-radius: var(--radius-full); font-size: var(--text-xs);
  opacity: 0; pointer-events: none; transition: all 0.2s ease; z-index: 9999; max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* toolbar */
#sketch-tools {
  position: fixed; bottom: 12px; right: 12px; z-index: 9999;
  font-family: system-ui; font-size: 11px;
  background: rgba(0,0,0,0.78); color: #fff; padding: 8px 10px;
  border-radius: 8px; opacity: 0.35; transition: opacity 0.2s;
  display: flex; gap: 6px; align-items: center;
}
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button {
  font-size: 11px; font-family: inherit; padding: 2px 6px;
  border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; cursor: pointer;
}
</style>
</head>
<body>

<div id="variant-nav">
  <div class="row1">
    <button class="variant-tab active" data-v="a" onclick="showVariant('a',this)">A: Page-first (D-09 as written)</button>
    <button class="variant-tab" data-v="b" onclick="showVariant('b',this)">B: Manuscript-first (inverts D-09)</button>
    <button class="variant-tab" data-v="c" onclick="showVariant('c',this)">C: Page + context rail</button>
  </div>
  <div class="row2">
    <label class="ctl-label" for="ms">Manuscript</label>
    <select id="ms" onchange="render()"></select>
    <button class="ctl" id="langBtn" onclick="toggleLang()">עברית / RTL</button>
    <button class="ctl" id="annotBtn" onclick="toggleAnnot()">Design notes</button>
    <span style="flex:1"></span>
    <label class="ctl-label">Width</label>
    <button class="ctl" onclick="setVp(375,this)">375</button>
    <button class="ctl" onclick="setVp(768,this)">768</button>
    <button class="ctl on" onclick="setVp(0,this)">Full</button>
  </div>
</div>

<div id="stage"></div>

<div id="toast"></div>

<div id="sketch-tools">
  <span>theme</span>
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">light</option>
    <option value="parchment">parchment</option>
    <option value="dark">dark</option>
  </select>
</div>

<script>

/* real-ish witness rows for the on-demand expansion */
const WITNESS_SAMPLE = [
  ['T-S A1.56','CUL'], ['T-S NS 4.12','CUL'], ['ENA 2591.7','JTS'],
  ['Ms. EVR II B 25','RNL'], ['Or. 5554A.31','BL'], ['Mosseri VII.12','Mosseri']

/* ---------------- i18n ---------------- */
const T = {
  en: {
    panel:'Computed identifications', count:n=>`${n} on this page`,
    caveat:'Not exhaustive — more identifications may exist.',
    onPage:'On this page', shown:n=>`${n} shown`,
    elsewhere:'Elsewhere in this manuscript',
    matches:'Matches', partial:'Partial match with',
    covLbl:(p)=>`${p}% of page (matched letters)`,
    letters:n=>`${n.toLocaleString()} letters`,
    nocov:'no coverage figure for this family',
    stamp:'unreviewed · algorithmic estimate',
    offs:o=>`offsets ${o}`,
    evidence:'Evidence',
    others:(n)=>`Other manuscripts matching this work · ${n.toLocaleString()}`,
    othersUnknown:'Other manuscripts matching this work',
    alsoShares:'Also shares text with',
    notIds:'collapsed by default; not presented as identifications',
    spangroup:(o,l,n)=>`One passage (offsets ${o}, ${l} letters) appears in ${n} works:`,
    relPages:'Pages matching this page in other manuscripts',
    relCount:n=>`${n} ${n===1?'page':'pages'}`,
    relQual:'unevaluated candidate alignments',
    more:'Show more possible matches',
    moreBreak:(s,c)=>`${s} short-passage, ${c} screening / review-only`,
    placeholder:'placeholder', voteToast:'Placeholder — voting arrives in Phase 137 (JUDGE-01).',
    pages:n=>`${n} ${n===1?'page':'pages'}`,
    thisPage:'this page',
    synthH:'What this manuscript contains',
    railH:'This manuscript',
    loading:'loading…', viewAll:'View all on the work page →',
    catShelf:'describes the shelfmark, not this folio',
    lowcov:'shown despite low page coverage',
    noneHere:'No computed identifications on this page.',
    nothingElse:'Nothing else identified in this manuscript.',
    behindToggle:'behind “show more”',
    pageOf:(a,b)=>`page ${a} of ${b}`, prev:'‹ Prev', next:'Next ›'
  },
  he: {
    panel:'זיהויים מחושבים', count:n=>`${n} בדף זה`,
    caveat:'אינו ממצה — ייתכנו זיהויים נוספים.',
    onPage:'בדף זה', shown:n=>`${n} מוצגים`,
    elsewhere:'במקומות אחרים בכתב־יד זה',
    matches:'התאמה ל', partial:'התאמה חלקית ל',
    covLbl:(p)=>`${p}% מהדף (אותיות מותאמות)`,
    letters:n=>`${n.toLocaleString()} אותיות`,
    nocov:'אין נתון כיסוי למשפחה זו',
    stamp:'לא נבדק · אמדן אלגוריתמי',
    offs:o=>`היסטים ${o}`,
    evidence:'ראיות',
    others:(n)=>`כתבי־יד נוספים התואמים לחיבור זה · ${n.toLocaleString()}`,
    othersUnknown:'כתבי־יד נוספים התואמים לחיבור זה',
    alsoShares:'חולק טקסט גם עם',
    notIds:'מכונס כברירת מחדל; אינו מוצג כזיהוי',
    spangroup:(o,l,n)=>`קטע אחד (היסטים ${o}, ${l} אותיות) מופיע ב־${n} חיבורים:`,
    relPages:'דפים התואמים לדף זה בכתבי־יד אחרים',
    relCount:n=>`${n} דפים`,
    relQual:'התאמות מועמדות שלא הוערכו',
    more:'הצג התאמות אפשריות נוספות',
    moreBreak:(s,c)=>`${s} קטעים קצרים, ${c} סינון / לעיון בלבד`,
    placeholder:'זמני', voteToast:'רכיב זמני — ההצבעה מגיעה בשלב 137 (JUDGE-01).',
    pages:n=>`${n} דפים`,
    thisPage:'הדף הזה',
    synthH:'מה מכיל כתב־יד זה',
    railH:'כתב־היד הזה',
    loading:'טוען…', viewAll:'לעמוד החיבור ←',
    catShelf:'מתאר את המדף, לא את הדף הזה',
    lowcov:'מוצג אף שכיסוי הדף נמוך',
    noneHere:'אין זיהויים מחושבים בדף זה.',
    nothingElse:'לא זוהה דבר נוסף בכתב־יד זה.',
    behindToggle:'מאחורי «הצג עוד»',
    pageOf:(a,b)=>`עמוד ${a} מתוך ${b}`, prev:'› הקודם', next:'הבא ‹'
  }
};

const ANNOT = {
  d13d:{en:'<b>D-13d KNOWN FLAW, corrected here.</b> In the deployed asset these two sit on the byte-identical span 0–962 under DIFFERENT canonical_work_ids, so D-13a\'s merge misses them and D-13d files them as generic shared text — rendering 1 identification where there should be 2. Shown collapsed (same work at two granularities) with the narrower title as a sub-line. Whether the alias is dropped outright or kept as this sub-line is a gate-1 decision. Coverage 47% is derived from the sibling row, not extracted.'},
  d13f:{en:'<b>D-13f applied.</b> The earlier mockup put a human-review badge (bilingual, with a tick) on this row. That badge is now dropped from every surface until the provenance of the 121 human_confirmed rows is established — Phase 134\'s closeout left it open, “internal deck vs owner”, never resolved. So every row everywhere reads “unreviewed · algorithmic estimate”, which is at least uniform and true. The badge literals are deliberately not reproduced anywhere in this file so a grep-based invariant stays clean.'},
  d13g:{en:'<b>D-13g fix, visible.</b> This human-confirmed row is dropped today by get_claims_for_page\'s routing_status=\'shipped\' SQL filter before is_default_eligible() — which returns True for human_confirmed unconditionally — ever runs. 19 of 121 rows are affected. With the fix it renders, carrying a low-coverage note. Note the interaction with D-13f: with the badge gone, the reader sees no stated reason for its presence.'}
};

/* ---------------- state ---------------- */
let V = 'a', LANG = 'en', ELSEWHERE_PAGE = 0, GATED_OPEN = false;
const PAGE_SIZE = 5;
const t = () => T[LANG];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur = () => MSS[document.getElementById('ms').selectedIndex];

function annotBox(k){ const a = ANNOT[k]; return a ? `<div class="annot">${a.en}</div>` : ''; }

/* ---------------- row renderers ---------------- */
function rowHTML(r, idx){
  const L = t();
  const verb = r.family === 'direct' ? L.matches : L.partial;
  const workLink = `<a class="idrow-work" href="#" onclick="toast('→ /work/${r.wid}');return false;">${esc(r.work)}</a>`;
  const head = LANG === 'he'
    ? `<span class="idrow-verb">${verb}</span>${workLink}`
    : `<span class="idrow-verb">${verb}</span> ${workLink}`;

  const cov = r.cov != null
    ? `<span class="cov"><b>${L.covLbl(r.cov)}</b></span><span class="stamp">·</span><span class="cov">${L.letters(r.letters)}</span>`
    : `<span class="nocov">${L.nocov}</span>`;

  const aliasSub = r.alias
    ? `<div class="sub">↳ ${LANG==='he'?'אותו קטע מותאם גם ל':'the same passage also matches'} <b>${esc(r.alias.title)}</b> <span class="offs">${esc(r.alias.wid)}</span></div>`
    : '';

  const othersLbl = r.othersUnknown ? L.othersUnknown : L.others(r.others);

  return `
  <div class="idrow ${r.lowcov?'low-cov':''}">
    <div class="idrow-top">${head}
      ${r.author?`<span class="idrow-author">${esc(r.author)}</span>`:''}</div>
    <div class="idrow-meta">
      <span class="band">${esc(r.band)}</span>
      ${cov}
      <span class="stamp">·</span><span class="stamp">${L.stamp}</span>
      <span class="offs">${L.offs(r.offs)}</span>
    </div>
    ${aliasSub}
    <div class="idrow-acts">
      <button class="linkbtn" onclick="toast('${L.evidence} → PANEL-03 (gate 6)')">${L.evidence}</button>
      <button class="linkbtn" onclick="expandWitnesses(this,'${r.wid}')">${othersLbl} ▸</button>
      <span class="vote">
        <button onclick="toast(t().voteToast)">✓</button>
        <button onclick="toast(t().voteToast)">?</button>
        <button onclick="toast(t().voteToast)">✗</button>
        <span class="ph">(${L.placeholder})</span>
      </span>
    </div>
    <div class="wslot"></div>
    ${r.annot?annotBox(r.annot):''}
  </div>`;
}

function expandWitnesses(btn, wid){
  const slot = btn.closest('.idrow').querySelector('.wslot');
  if (slot.dataset.open === '1'){ slot.innerHTML = ''; slot.dataset.open = '0'; return; }
  slot.dataset.open = '1';
  slot.innerHTML = `<div class="witnesses"><span class="spinner"></span>${t().loading}</div>`;
  setTimeout(() => {
    slot.innerHTML = `<div class="witnesses">${
      WITNESS_SAMPLE.map(([sm,lb]) =>
        `<div class="w"><span class="sm">${esc(sm)}</span><span class="lb">${esc(lb)}</span></div>`).join('')
    }<div class="w"><a class="sm" href="#" onclick="toast('→ /work/${wid}');return false;">${t().viewAll}</a></div></div>`;
  }, 320);
}

/* elsewhere — D-13h names the works */
function elsewhereInner(ms, opts){
  const L = t(), e = ms.elsewhere;
  if (!e.claims) return `<div class="disc-body"><span class="sc">${L.nothingElse}</span></div>`;
  let works = e.works.filter(w => GATED_OPEN || !w.gated);
  const total = Math.ceil(works.length / PAGE_SIZE);
  let pager = '';
  if (works.length > PAGE_SIZE){
    const s = ELSEWHERE_PAGE * PAGE_SIZE;
    pager = `<div class="pager">
      <button class="linkbtn" onclick="pageElsewhere(-1)" ${ELSEWHERE_PAGE===0?'disabled':''}>${L.prev}</button>
      <span>${L.pageOf(ELSEWHERE_PAGE+1, total)}</span>
      <button class="linkbtn" onclick="pageElsewhere(1)" ${ELSEWHERE_PAGE>=total-1?'disabled':''}>${L.next}</button>
    </div>`;
    works = works.slice(s, s + PAGE_SIZE);
  }
  const chips = works.map(w => `
    <span class="workchip ${w.here?'here':''} ${w.gated?'gated':''}" onclick="toast('→ /work · ${esc(w.title)}')">
      ${esc(w.title)}
      <span class="pg">${w.here?L.thisPage:L.pages(w.pages)}${w.gated?' · '+L.behindToggle:''}</span>
    </span>`).join('');
  const missing = e.namesMissing
    ? `<div class="annot"><b>D-13h requires names here.</b> The work titles for these ${e.claims} claim(s) were not captured in the mockup extract, so this renders as a bare count — exactly the failure mode D-13h forbids. In the real panel these must be named.</div>`
    : '';
  const illus = e.illustrative
    ? `<div class="annot"><b>Per-work page counts are illustrative.</b> The real, extracted figures are 426 further identifications across 426 pages from 8 works; the split across the eight Nevi'im books is reconstructed for layout only.</div>`
    : '';
  const lowcovNote = e.works.some(w=>w.note==='lowcov')
    ? `<div class="sc" style="margin-top:6px">⚠ ${L.lowcov} — רש"י על איכה</div>` : '';
  return `<div class="disc-body">
    ${e.namesMissing ? `<span class="sc">${e.claims} · ${L.pages(e.pages)}</span>` : ''}
    <div class="workchips">${chips}</div>${pager}${lowcovNote}${missing}${illus}
    ${e.works.some(w=>w.annot) ? annotBox('d13g') : ''}
  </div>`;
}

function pageElsewhere(d){ ELSEWHERE_PAGE += d; render(); }

/* shares-text bucket (level 2) */
function sharesHTML(ms){
  const L = t();
  const groups = ms.shares, rel = ms.related;
  const n = groups.length;
  const sum = [];
  if (n) sum.push(`${n} ${LANG==='he'?'קבוצות קטע':'passage group'+(n>1?'s':'')}`);
  if (rel) sum.push(L.relCount(rel));
  if (!n && !rel) return '';
  return `<details class="disc notid">
    <summary>${esc(L.alsoShares)} <span class="sc">· ${sum.join(' · ')}</span>
      <span class="qual">— ${L.notIds}</span></summary>
    <div class="disc-body">
      ${groups.map(g => `<div class="spangroup">${L.spangroup(g.offs, g.letters, g.works.length)}
        <div class="works">${g.works.map(esc).join(' · ')}</div></div>`).join('')}
      ${rel ? `<div class="spangroup"><b>${esc(L.relPages)}</b> — ${L.relCount(rel)}
        <span class="qual">${L.relQual}</span>
        <div><button class="linkbtn" onclick="toast('${esc(L.relPages)} → rows behind this toggle (D-11)')">${LANG==='he'?'הצג דפים':'Show pages'} ▸</button></div></div>` : ''}
    </div>
  </details>`;
}

/* level 3 — screening / short-passage toggle */
function moreHTML(ms){
  const L = t(), h = ms.hidden, n = h.short + h.screening;
  const extra = ms.elsewhere.works.some(w=>w.gated)
    ? `<div class="annot"><b>Interaction finding.</b> Part of the codex picture that makes this page judgeable — the 7 pages of רש"י על שיר השירים — sits in the screening bucket. Turning this toggle on completes the Rashi-on-Megillot reading. So the manuscript-coherence aid (D-13h) and the BAND-03 screening gate are coupled, which no document anticipated.</div>`
    : '';
  return `<details class="disc" ${GATED_OPEN?'open':''} ontoggle="syncGated(this)">
    <summary>${esc(L.more)} <span class="sc">· ${n}</span>
      <span class="qual">— ${L.moreBreak(h.short, h.screening)}</span></summary>
    <div class="disc-body"><span class="sc">${n ? (LANG==='he'?'שורות סינון / קטעים קצרים מוצגות כאן':'screening and short-passage rows render here') : L.noneHere}</span>${extra}</div>
  </details>`;
}

function syncGated(el){ if (GATED_OPEN !== el.open){ GATED_OPEN = el.open; render(); } }

/* panel chrome */
function panelHead(ms){
  const L = t();
  return `<div class="panel-head">
    <span class="ico">◈</span><span class="panel-title">${esc(L.panel)}</span>
    <span class="panel-count">${L.count(ms.onPage.length)}</span>
  </div>
  <div class="panel-caveat">${esc(L.caveat)}</div>`;
}

function pageRows(ms){
  const L = t();
  if (!ms.onPage.length) return `<div class="idrow"><span class="sc">${L.noneHere}</span></div>`;
  return `<div class="group-head">${esc(L.onPage)} <span class="n">— ${L.shown(ms.onPage.length)}</span></div>
    ${ms.onPage.map(rowHTML).join('')}`;
}

function elsewhereSection(ms, open){
  const L = t(), e = ms.elsewhere;
  const cnt = e.claims ? `<span class="sc">· ${e.claims} · ${L.pages(e.pages)}</span>` : `<span class="sc">· 0</span>`;
  return `<details class="disc" ${open?'open':''}>
    <summary>${esc(L.elsewhere)} ${cnt}</summary>${elsewhereInner(ms)}</details>`;
}

/* synthesis block (variant B) + rail (variant C) share this */
function coherenceInner(ms){
  const L = t(), e = ms.elsewhere;
  if (!e.claims && ms.onPage.length <= 1)
    return `<div class="synth-lead">${esc(ms.onPage[0]?ms.onPage[0].work:'—')} <span class="sc">— ${L.thisPage}</span></div>
            <div class="sc">${L.nothingElse}</div>`;
  const here = ms.onPage.map(r => `<span class="workchip here" onclick="toast('→ /work/${r.wid}')">${esc(r.work)} <span class="pg">${L.thisPage}</span></span>`).join('');
  return `<div class="workchips">${here}</div>${elsewhereInner(ms)}`;
}

/* ---------------- variants ---------------- */
function variantA(ms){
  return `<div class="panel">${panelHead(ms)}<div class="panel-body">
    ${pageRows(ms)}
    ${elsewhereSection(ms, false)}
    ${sharesHTML(ms)}
    ${moreHTML(ms)}
  </div></div>
  <div class="annot"><b>Variant A = D-09 exactly as locked:</b> “On this page” first, “Elsewhere in this manuscript” collapsed beneath. Also the path of least resistance for NiceGUI — a plain vertical stack of q-expansion-items. Ask yourself whether the codex picture is reachable enough here, given you said understanding the whole manuscript is the primary job.</div>`;
}

function variantB(ms){
  const L = t();
  return `<div class="panel">${panelHead(ms)}
    <div class="synth">
      <div class="synth-h">${esc(L.synthH)}</div>
      ${coherenceInner(ms)}
    </div>
    <div class="panel-body">
      ${pageRows(ms)}
      ${sharesHTML(ms)}
      ${moreHTML(ms)}
    </div></div>
  <div class="annot"><b>Variant B INVERTS D-09.</b> The manuscript picture is promoted above the page's own rows and is no longer collapsed; “Elsewhere in this manuscript” stops being a separate collapsed group and becomes the synthesis header. This directly serves the job you picked — but if it wins, <b>D-09 needs a dated owner amendment</b>, because D-09 locks “On this page first, then Elsewhere (collapsed)”.</div>`;
}

function variantC(ms){
  const L = t();
  return `<div class="panel">${panelHead(ms)}
    <div class="cwrap">
      <div class="panel-body">
        ${pageRows(ms)}
        ${sharesHTML(ms)}
        ${moreHTML(ms)}
      </div>
      <aside class="rail">
        <div class="rail-h">${esc(L.railH)}</div>
        ${coherenceInner(ms)}
      </aside>
    </div></div>
  <div class="annot"><b>Variant C keeps D-09's reading order</b> (page rows lead) while making the manuscript context permanently visible rather than collapsed — arguably honouring D-09's intent without its collapse. <b>Check this one at 375px first:</b> the rail drops below the rows on mobile, which is where ~68% of comparable traffic is, so on a phone C degrades toward A. That is the main argument against it.</div>`;
}

/* ---------------- shell ---------------- */
function render(){
  const ms = cur(), L = t();
  const dir = LANG === 'he' ? 'rtl' : 'ltr';
  const catWarn = ms.catScope === 'shelfmark'
    ? `<span class="cat-scope-warn">${LANG==='he'?'מדף':'shelfmark'}</span>`
    : '';
  const d13i = ms.catScope === 'shelfmark'
    ? `<div class="annot"><b>D-13i.</b> This catalogue line describes the shelfmark — on a composite volume, other leaves entirely — not this folio. Left unlabelled beside a page-level claim it manufactures a false alarm: on Moss. V,374 a bill-of-divorce description sat next to a verifiably correct Rashi-on-Esther claim (the span ends with the colophon תם כל הפירוש). So it is labelled here, not silently juxtaposed.</div>`
    : '';

  const body = V === 'a' ? variantA(ms) : V === 'b' ? variantB(ms) : variantC(ms);

  document.getElementById('stage').innerHTML = `
    <div class="ms-note">${esc(ms.note)}</div>
    <div class="browse-frame" dir="${dir}">
      <div class="browse-head">
        <div class="sm">${esc(ms.sm)}</div>
        <div class="lib">${esc(ms.lib)}</div>
      </div>
      <div class="browse-body">
        <div class="cat-line">${catWarn}${esc(ms.cat)}${ms.catScope==='shelfmark'?` <i>— ${esc(L.catShelf)}</i>`:''}</div>
        ${d13i}
        ${body}
      </div>
    </div>`;
}

function showVariant(v, el){
  V = v; ELSEWHERE_PAGE = 0;
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}
function toggleLang(){
  LANG = LANG === 'en' ? 'he' : 'en';
  document.getElementById('langBtn').textContent = LANG === 'en' ? 'עברית / RTL' : 'English / LTR';
  document.getElementById('langBtn').classList.toggle('on', LANG === 'he');
  render();
}
function toggleAnnot(){
  document.body.classList.toggle('show-annot');
  document.getElementById('annotBtn').classList.toggle('on', document.body.classList.contains('show-annot'));
}
function setVp(w, el){
  document.querySelectorAll('#variant-nav .row2 button.ctl').forEach(b => { if (/^\d+$|^Full$/.test(b.textContent)) b.classList.remove('on'); });
  el.classList.add('on');
  document.getElementById('stage').style.maxWidth = w ? w + 'px' : '';
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* init */
const sel = document.getElementById('ms');
MSS.forEach(m => { const o = document.createElement('option'); o.textContent = `${m.sm} (${m.lib})`; sel.appendChild(o); });
sel.selectedIndex = 3; /* Moss. V,374 — the coherence demonstration case */
render();
</script>
</body>
</html>
