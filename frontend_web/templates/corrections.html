{% extends "base.html" %}

{% block title %}תיקונים - Genizah Corrections{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2><i class="bi bi-pencil-square"></i> תיקונים</h2>
        <p class="text-muted">צפו בתיקונים שהוגשו על ידי הקהילה</p>
    </div>

    <!-- Filters -->
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-body">
                <form id="filter-form" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">סטטוס</label>
                        <select class="form-select" id="filter-status">
                            <option value="">הכל</option>
                            <option value="approved">מאושר</option>
                            <option value="pending">ממתין</option>
                            <option value="rejected">נדחה</option>
                            <option value="needs_revision">דורש תיקון</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">סוג תיקון</label>
                        <select class="form-select" id="filter-type">
                            <option value="">הכל</option>
                            <option value="text_correction">תיקון טקסט</option>
                            <option value="text_addition">הוספת טקסט</option>
                            <option value="text_deletion">מחיקת טקסט</option>
                            <option value="reading_suggestion">הצעת קריאה</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">חיפוש בטקסט</label>
                        <input type="text" class="form-control" id="filter-text"
                               placeholder="חפש בתוכן התיקון...">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> סנן
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span id="results-count" class="text-muted">טוען...</span>
            <a href="/new-correction" class="btn btn-success" id="new-correction-btn" style="display: none;">
                <i class="bi bi-plus-lg"></i> תיקון חדש
            </a>
        </div>

        <div id="corrections-list">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>

        <div id="pagination" class="mt-4"></div>
    </div>
</div>

<script>
let currentPage = 1;
const pageSize = 20;

async function loadCorrections(page = 1) {
    currentPage = page;
    const container = document.getElementById('corrections-list');
    container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

    const params = {
        page: page,
        page_size: pageSize
    };

    const status = document.getElementById('filter-status').value;
    const type = document.getElementById('filter-type').value;
    const text = document.getElementById('filter-text').value;

    if (status) params.status = status;
    if (type) params.correction_type = type;
    if (text) params.search_text = text;

    try {
        const result = await api.listCorrections(params);

        document.getElementById('results-count').textContent =
            `מציג ${result.items.length} מתוך ${result.total} תיקונים`;

        if (result.items.length > 0) {
            container.innerHTML = result.items.map(c =>
                `<div data-correction-id="${c.id}">${createCorrectionCard(c)}</div>`
            ).join('');
        } else {
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-inbox display-4 text-muted"></i>
                    <p class="text-muted mt-3">לא נמצאו תיקונים</p>
                </div>
            `;
        }

        // Pagination
        document.getElementById('pagination').innerHTML =
            createPagination(result.page, result.total_pages, 'loadCorrections');

    } catch (error) {
        console.error('Failed to load corrections:', error);
        container.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i> שגיאה בטעינת תיקונים
            </div>
        `;
    }
}

document.getElementById('filter-form').addEventListener('submit', function(e) {
    e.preventDefault();
    loadCorrections(1);
});

document.addEventListener('DOMContentLoaded', function() {
    loadCorrections();

    // Show new correction button for authenticated users
    if (auth.canSubmitCorrections()) {
        document.getElementById('new-correction-btn').style.display = 'block';
    }
});
</script>
{% endblock %}
