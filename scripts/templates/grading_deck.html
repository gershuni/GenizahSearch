<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<title>דירוג יחסים — מדגם מעורבב</title>
<style>
 body{font-family:system-ui,Segoe UI,Arial;margin:0;background:#f5f5f5;color:#222}
 header{position:sticky;top:0;background:#fff;padding:10px 16px;border-bottom:1px solid #ddd;z-index:9}
 header button{padding:6px 12px;border-radius:8px;border:1px solid #bbb;background:#fff;cursor:pointer}
 .card{background:#fff;margin:14px;padding:16px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
 .cols{display:flex;gap:14px;flex-wrap:wrap}
 .pane{flex:1 1 380px;min-width:320px}
 .pane h4{margin:0 0 6px;font-weight:600;font-size:14px;color:#555}
 .txt{font-size:19px;line-height:1.9;background:#fafafa;border:1px solid #eee;
      border-radius:8px;padding:10px;max-height:340px;overflow:auto}
 .ctx{color:#9e9e9e}
 mark{background:#fff59d;padding:1px 2px;border-radius:3px}
 .grades{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
 .grades button{padding:8px 12px;border-radius:8px;border:1px solid #bbb;
   background:#fff;cursor:pointer;font-size:14px}
 .grades button.sel{background:#2c7d32;color:#fff;border-color:#2c7d32}
 .nav{margin-top:10px;display:flex;gap:8px}
 .nav button{padding:6px 14px;border-radius:8px;border:1px solid #bbb;background:#fff;cursor:pointer}
 .hint{margin-top:10px;color:#666;font-size:13px;line-height:1.7}
 .meta{color:#888;font-size:13px;margin-bottom:8px}
 .warn{background:#fff3e0;border:1px solid #ffb74d;padding:8px 12px;
   border-radius:8px;margin:14px;font-size:13px;line-height:1.7}
</style></head><body>
<header>
 <b>דירוג יחסים — מדגם מעורבב</b>
 <span id="prog" style="margin-inline-start:14px;color:#555"></span>
 <button onclick="jumpUngraded()">הבא שלא דורג</button>
 <button onclick="exportGrades()">⬇ ייצוא דירוגים</button>
 <span style="color:#aaa;margin-inline-start:10px">deck __DECKID__</span>
</header>
<div class="warn">
 הכרטיסים מעורבבים ואינם מסומנים — אי אפשר לדעת איזו שיטה החזירה כל תוצאה, וזו הכוונה.
 דרגו את <b>היחס בין שני הקטעים</b> בלבד.
 תוצאה שאינה כתב היד שממנו נלקח הטקסט עדיין יכולה להיות מקבילה אמיתית, ויש לדרג אותה ככזו.
</div>
<div id="app"></div>
<script>
const DATA = __DATA__;
const GRADES = __GRADES__;
const LS_KEY = "parallels_relation_grades___DECKID__";
let grades = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
let idx = 0;
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(grades)); }
function esc(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function pane(label, b, m, a){
 return `<div class="pane"><h4>${label}</h4>
  <div class="txt"><span class="ctx">${esc(b)}</span><mark>${esc(m)}</mark><span class="ctx">${esc(a)}</span></div></div>`;
}
function render(){
 if(!DATA.length){ document.getElementById("app").innerHTML="<div class='card'>deck ריק</div>"; return; }
 idx = Math.max(0, Math.min(idx, DATA.length-1));
 const d = DATA[idx], g = grades[d.id];
 document.getElementById("prog").textContent =
   `${idx+1} / ${DATA.length}  (${Object.keys(grades).length} דורגו)`;
 const btns = GRADES.map(([k,lab]) =>
   `<button class="${g===k?'sel':''}" onclick="grade('${k}')">${lab}</button>`).join("");
 document.getElementById("app").innerHTML = `
  <div class="card">
   <div class="meta">${d.aligned ? `קטע חופף: <b>${d.letters}</b> אותיות`
     : `<b style="color:#c62828">לא נמצא קטע חופף</b> — התוצאה הוחזרה על ידי אחת השיטות; מוצגות תחילות שני הטקסטים`}</div>
   <div class="cols">${pane("הטקסט שחיפשתי", d.q_before, d.q_match, d.q_after)}${pane("מה שהוחזר", d.r_before, d.r_match, d.r_after)}</div>
   <div class="grades">${btns}</div>
   <div class="nav"><button onclick="move(-1)">→ הקודם</button><button onclick="move(1)">הבא ←</button></div>
   <div class="hint">מקשים: 1–9 לדירוג ומעבר · חיצים לניווט ·
    הקטע המסומן הוא ההתאמה שחושבה, וההקשר סביבו באפור.
    דרגו את <b>היחס</b>: 1 = אותו טקסט (אותה יצירה או ציטוט ישיר, כולל שינויי סופרים) ·
    3 = ניסוח שונה · 4 = נוסחה תיעודית או ליטורגית · 8 = ציטוט מקרא/חז״ל/תפילה ·
    9 = אותו דף שצולם פעמיים · 5–7 = ההתאמה שגויה.</div>
  </div>`;
}
function grade(k){ grades[DATA[idx].id]=k; save(); move(1); }
function move(dd){ idx+=dd; render(); }
function jumpUngraded(){
 for(let i=0;i<DATA.length;i++){ const j=(idx+1+i)%DATA.length;
   if(!grades[DATA[j].id]){ idx=j; render(); return; } }
 alert("הכל דורג!");
}
function exportGrades(){
 const out = DATA.filter(d=>grades[d.id]).map(d=>({id:d.id, grade:grades[d.id]}));
 const payload = {deck:"__DECKID__", grader:"", verdicts:out};
 const blob = new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
 const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
 a.download="relation_verdicts___DECKID__.json"; a.click();
}
document.addEventListener("keydown", e=>{
 if(e.key>="1" && e.key<="9"){
   const byNum={1:"same_text",2:"same_text",3:"paraphrase",4:"shared_formula",
     5:"topical",6:"unrelated",7:"junk",8:"canonical",9:"duplicate_photo"};
   grade(byNum[+e.key]);
 } else if(e.key==="ArrowLeft"){ move(1); }
 else if(e.key==="ArrowRight"){ move(-1); }
});
render();
</script></body></html>
