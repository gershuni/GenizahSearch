[tool.pytest.ini_options]
# Phase 78 (Concern #7 fix): register the `slow` marker so --strict-markers tooling
# accepts @pytest.mark.slow without UnknownMark warnings.
#
# DELIBERATELY OMITTED: a repo-wide default-exclude addopts filter. Adding one
# would silently exclude slow tests for every developer + CI invocation, which
# changes behavior for tests/e2e/test_performance.py and any future slow tests
# unrelated to Phase 78.
#
# Run slow tests explicitly with:  pytest -m slow tests/test_search_api_soak.py
# See tests/README.md for full slow-test invocation documentation.
#
markers = [
    "slow: marks tests as slow; run with `pytest -m slow`",
    "e2e: marks tests requiring Selenium/ChromeDriver (paired with slow)",
    "packaging: marks tests requiring the packaged EXE (release CI only; Phase 95 D-43)",
    "scale: marks tests requiring large synthesised corpora; run with --run-scale",
    "gui: marks PyQt6 tests that construct a real QApplication and dispatch widget events; deselected from the main `tests` job (-m 'not gui') and run in a dedicated fresh-process `gui-tests` CI job to avoid the accumulated-Qt-state segfault in the full suite",
    "render_smoke: marks NiceGUI render-smoke tests (tests/render_smoke/) that enter+tear down the app lifespan via asyncio.run; deselected from the main `tests` job (-m 'not render_smoke') and run in a dedicated fresh-process `render-smoke-tests` CI job because the lifespan teardown closes the event loop and deletes the auto-index client, polluting any later NiceGUI test in the same process",
    "atlas_bake: marks bake-invariant tests (tests/atlas_bake/) that require the pinned bake-time deps in requirements-atlas-bake.txt (networkx/python-louvain/Brotli) -- NOT installed in the main `tests` job (requirements-lock.txt only), so those tests self-skip there via `pytest.importorskip`; deselected from the main `tests` job (-m 'not atlas_bake') and run for real in a dedicated `atlas-bake-tests` CI job that installs the pinned deps + Node (for the companion 133-04 JS golden-decode/DOM-XSS tests, also tagged atlas_bake under the same directory)",
]

# Phase 85 (Plan 85-03 cross-plan integration fix): restrict collection to
# `test_*.py` only. The default also matches `*_test.py`, which collected
# `skills/cairo-genizah-research/scripts/smoke_test.py` (a manual smoke
# harness, not a pytest test). That collection bound `sys.modules['scripts']`
# to the skill's `scripts/__init__.py`, breaking `from scripts import
# export_fist_enrichment` in tests/test_export_fist_synthetic.py. Restricting
# to `test_*.py` excludes the smoke harness and keeps the project namespace
# clean. No other `*_test.py` files exist in first-party code.
python_files = ["test_*.py"]
