ם והנסתרים. והנה כולם יאבדו. אבל אמר שלא יכלה אותם במלחמה ביום אחד", "after": ". ולא שיגרשם מן הארץ בשנה אחת. פן תהיה הארץ שממה ורבה עליך חית השדה. \n>> והוסיף עוד להבטיח"}, "ref": {"before": "אבנוכנעלדעתיכללשונעקבהגלגולוסבובעקובהלבויעקבניזהפעמימויהואעשהבעקבהענינגלגולימוסבותולכניקרא", "span": "ויעקבישורונכיהפכהעקובמישורוכנאחוריהרגלשנקראעקבוידואוחזתבעקבעשויקראנוכנבעבורהיותמכמוהיותומעוגלכאשריקראהלשונאמצעהידוהרגלכפותבעבורהיותמכמוכפותהזהבומורגלהואבלשונכמושאמרובסיפרימימינואשדתלמוכשהיההדבוריוצאמפיהקבההיהיוצאדרכימינושלקדשלשמאלנשלישראלועוקבאתמחנהישראלשנימעשרמילעלשנימעשרמילוכוספרידברימעמכלוממקיפוכנלשונמבאינעליובעקיפינבבליבבאקמאקיגאבסבותוגלגולינכמועקיבינששתיהאותיותהאלהשוותלהמכאשרפרשתיכברוהזכיראתהמשפטימהאלהלהזהירמאדבמשפטימכילאיהיהעמרבכולונזהרבמצותכולנשלאיחטאובהנכללרקבמשפטימיעמידוהתורהכמושנאמבהנוכלישראלישמעווייראוועודכירבימירחמומלסקולהאישולשרופאותואחרישעשיתשנעשתהעברהכמושיאמרלאתחוסעינכועודשייראומנהתקיפימומנהמטעימכמושאמרלאתגורומפניאישכיהמשפטלאלהימהואואמרבנביאהשקרלאתגורממנווהזכירכלאלהבמסיתלאתאבהלוולאתשמעאליוולאתחוסעינכעליוולאתחמולולאתכסהעליויזהירלאתשמעאליומפניהטעאתוולאתחוסמפניהרחמנותשירחמורכיהלבבעלהנדונימולאתכסהשלאתשתוקבעבורתקפוויראתבנימשפחתווטעמואהבככאשרתעשההמשפטימלאהבתהשמגמהואיאהובאותכויתכנשיהיהואהבכיוצאשיאהיבאותכלמשפחותהנשפטימולאישנאוכעליהמוברככשלאתאונהאליכרעהבעבורהמשפטוהרבכשלאתמעטבאבדנהעוברימאפילויהיותמידאורבימכאנשיעירהנדחתוהסירייממככלחליהנהוגלבאבעולמוהזכירכלמדוימצרימהרעימלהבטיחונתנמבכלשונאיכאושירמוזכיבעשותמהמשפטימינצלומהמואמלאיעשואותמיבאועליהמכאשרבאועלהמצרימכאשראמרבתוכחותוהשיבבככלמדוימצרימוגמוכברפירשתיזהבסדרויהיבשלחוהזכירתחלהבמשפטימלכלותולהכריתעובדיעזולככאמרוואכלתאתכלהעמימשתכריתמכענינשנכילחמנוהמכיאכלאתיעקבואכלוהוויכלוהווכנרבימואמרלאתחוסעינכעליהמכאשרהזכרתיכיברחמנותהטפשימיאבדכלמשפטלאתוכלכלותממהריבטיחשהשמיכריתמכולמוישלחבהמהצרעהלהאבידהנשארימוהנסתרימוהנהכולמיאבדואבלאמרשלאיכלהאותמבמלחמהביומאחד", "after": "ולאשיגרשממנהארצבשנהאחתפנתהיההארצשממהורבהעליכחיתהשדהוהוסיפעודלהבטיחשלאיהיואלההנשארימרובמאבל"}}, {"id": "new|990001233420205171_IE63928772_P000012_FL63928785|M:Ytext499002", "type":      <div class="pane"><h4>קטע הדף (fragment, spaced)</h4>
       <div class="txt">${spacedBody(d.frag_spaced)}</div></div>
     <div class="pane"><h4>מקור מזוהה (identified work) — spaced</h4>
       <div class="candhead">[${esc(w.cat)}] ${w.author?esc(w.author)+" — ":""}<b>${esc(w.title)}</b>
         · <span class="d">density ${d.best_density}</span></div>
       <div class="txt">${refBody}</div></div>
    </div>`;
 }
 document.getElementById("app").innerHTML = `
  <div class="card">
   ${inner}
   <div class="grades">${btns}</div>
   <div class="note"><div class="lbl">הערה / note (optional):</div>
     <textarea rows="2" oninput="setNote(this.value)">${esc(r.note||"")}</textarea></div>
   <div class="nav">
    <button onclick="move(-1)">← Prev</button>
    <button onclick="move(1)">Next →</button>
   </div>
   <div class="hint">${hintFor(d.type)}</div>
  </div>`;
}

function hintFor(t){
 if(t==="residue_unidentified") return "היחידה הכי־מועתקת שאינה מזוהה ע\"י Track-1. "
   +"האם אתה מזהה את החיבור (שם), מכיר את הסוג בלי שם, או שזו תגלית? "
   +"Keys 1–5 grade &amp; advance · ←/→ navigate.";
 return "הדף זוהה כעד חדש (mesirah מצביע על כתב־יד אחר). השווה קטע הדף למקור המזוהה: "
   +"עד חדש מאושר? חיבור נכון אך כנראה כבר ידוע? או זיהוי שגוי? "
   +"Keys 1–4 grade &amp; advance · ←/→ navigate.";
}

function grade(k){ const d=items()[idx]; rec(d.id).grade=k; save(); move(1); }
function setWName(v){ const d=items()[idx]; rec(d.id).work_name=v; save(); }
function setNote(v){ const d=items()[idx]; rec(d.id).note=v; save(); }
function move(dd){ idx+=dd; render(); }
function jumpUngraded(){
 const list=items();
 for(let i=0;i<list.length;i++){
   const j=(idx+1+i)%list.length;
   if(!(store[list[j].id]&&store[list[j].id].grade)){ idx=j; render(); return; } }
 alert("All graded in this filter!");
}
function exportGrades(){
 const out = DATA.filter(d=>store[d.id]&&store[d.id].grade).map(d=>{
   const r=store[d.id];
   const o={id:d.id, type:d.type, grade:r.grade};
   if(r.work_name) o.work_name=r.work_name;
   if(r.note) o.note=r.note;
   return o;
 });
 const blob = new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "grades_discovery_2026-07-09.json"; a.click();
}
document.addEventListener("keydown", e=>{
 const tag=(e.target.tagName||"").toLowerCase();
 if(tag==="input"||tag==="textarea") return;
 const d=items()[idx]; if(!d) return;
 const gs=GRADE_SETS[d.type];
 if(/^[1-9]$/.test(e.key)){
   const n=+e.key-1;
   if(n<gs.length){ grade(gs[n][0]); e.preventDefault(); }
 } else if(e.key==="ArrowLeft"){ move(1); }
 else if(e.key==="ArrowRight"){ move(-1); }
});
const types = ["all",...new Set(DATA.map(d=>d.type))];
document.getElementById("filter").innerHTML =
 types.map(s=>`<option value="${s}">${s} (${s==="all"?DATA.length:DATA.filter(d=>d.type===s).length})</option>`).join("");
document.getElementById("filter").onchange = e=>{ filt=e.target.value; idx=0; render(); };
render();
</script>
</body>
</html>
